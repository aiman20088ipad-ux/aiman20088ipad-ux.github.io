/* ---------------------------- التنبيهات ---------------------------- */
function renderNotifications(c){
  // القائمة الرئيسية: أولوية واحدة لكل عميل. "ذكرني" مستقلة تماماً بقسمها الخاص (لا تدخل هذا الترتيب).
  const PRIORITY={"يسوق الآن":1,"باقي للاستحقاق أقل من 3 أيام":2,"مستحق الآن":3,"وعود السداد":4,"وعد بالسداد اليوم":5,"مضى على استحقاقه أكثر من 14 يوم":6,"مواعيد متابعة":7,"يحتاج مراجعة المدير":8};
  const canSeeAll = isAdmin()||isAccountant();
  const allActive = ST.notifications.filter(n=>n.status==="جديد" && (canSeeAll || n.user_id===ST.currentUserId));
  const active = allActive.filter(n=>n.notification_type!=="ذكرني"); // القائمة الرئيسية بدون ذكرني
  const reminders = allActive.filter(n=>n.notification_type==="ذكرني").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  const typeFilter = ST.view.params?.type || "";

  const typeCounts={}; Object.keys(PRIORITY).forEach(t=>typeCounts[t]=0); typeCounts["ذكرني"]=reminders.length;
  active.forEach(n=>{ typeCounts[n.notification_type]=(typeCounts[n.notification_type]||0)+1; });

  // عدد "الجديد غير المُشاهَد" لكل نوع: كل تنبيه اتولّد بعد آخر مرة فتحت فيها بطاقة هذا النوع
  const lastViewedMap={}; (ST.notifTypeViews||[]).filter(v=>v.user_id===ST.currentUserId).forEach(v=>{ lastViewedMap[v.notification_type]=v.last_viewed_at; });
  const unseenCounts={};
  allActive.forEach(n=>{
    const lastViewed=lastViewedMap[n.notification_type];
    if(!lastViewed || new Date(n.created_at)>new Date(lastViewed)) unseenCounts[n.notification_type]=(unseenCounts[n.notification_type]||0)+1;
  });

  let rows;
  if(typeFilter){
    rows = active.filter(n=>n.notification_type===typeFilter).map(n=>({primary:n, others:[]}));
  }else{
    const byCustomer=new Map();
    active.forEach(n=>{ if(!byCustomer.has(n.customer_id)) byCustomer.set(n.customer_id,[]); byCustomer.get(n.customer_id).push(n); });
    rows=[];
    byCustomer.forEach(list=>{
      list.sort((a,b)=>(PRIORITY[a.notification_type]||99)-(PRIORITY[b.notification_type]||99));
      rows.push({primary:list[0], others:list.slice(1)});
    });
  }
  rows.sort((a,b)=>(PRIORITY[a.primary.notification_type]||99)-(PRIORITY[b.primary.notification_type]||99));

  const allCardTypes=[...Object.keys(PRIORITY).slice(0,7),"ذكرني",...Object.keys(PRIORITY).slice(7)]; // إدراج ذكرني بمكانها بالعرض فقط
  const cardsHTML=allCardTypes.map(type=>{
    const s=NOTIF_STYLE[type]; const cnt=typeCounts[type]||0; const unseen=unseenCounts[type]||0;
    return `<div class="type-card ${typeFilter===type?'active':''}" data-typecard="${esc(type)}" style="cursor:pointer; opacity:${cnt?1:.5}; position:relative;">
      ${unseen?`<span style="position:absolute; top:6px; inset-inline-end:6px; background:#DC2626; color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center; line-height:1.5;">${unseen>99?"99+":unseen}</span>`:""}
      <div class="icon-badge" style="background:${s.bg}; color:${s.fg};">${s.icon}</div>
      <div class="t-label">${esc(type)}</div>
      <div class="t-val">${cnt}</div>
      <div class="t-unit">عميل</div>
    </div>`;
  }).join("");

  c.innerHTML=`
  <div class="type-grid">${cardsHTML}</div>

  <div class="toolbar">
    ${canImport()?`<button class="btn btn-primary" id="genBtn">${ICONS.plus}تحديث التنبيهات الآن</button>`:""}
    <button class="btn" id="genReminderBtn" style="background:#7C3AED; color:#fff; font-weight:700;">${ICONS.clock} ذكرني</button>
    <span style="font-size:12px; color:var(--gray-500);">يتحدّث تلقائياً كل يوم — والزر للتحديث الفوري</span>
    ${typeFilter?`<button class="btn btn-outline btn-sm" id="clearTypeBtn">إلغاء الفلترة (${esc(typeFilter)})</button>`:""}
  </div>

  <div class="section-title">${typeFilter?`عملاء: ${esc(typeFilter)} (${rows.length})`:`التنبيهات النشطة (${rows.length} عميل)`}</div>
  <div class="table-wrap"><table><thead><tr>
    <th>${typeFilter?"النوع":"أهم تنبيه"}</th><th>العميل</th>${typeFilter?"":"<th>تنبيهات أخرى</th>"}<th>تاريخ الاستحقاق</th><th>المبلغ المتبقي</th><th>السبب</th><th>مسؤول المتابعة</th><th></th>
  </tr></thead><tbody>
  ${rows.map(row=>{
    const n=row.primary;
    const cu=ST.customers.find(x=>x.id===n.customer_id);
    const due=cu?customerDueComputed(cu.id):null;
    const total=cu?customerTotalYER(cu.id):0;
    const others=row.others.length?row.others.map(o=>notifPillHTML(o.notification_type)).join(" "):'<span style="color:var(--gray-400);font-size:11px;">—</span>';
    return `<tr>
      <td>${notifPillHTML(n.notification_type)}</td>
      <td class="row-click" data-open="${n.customer_id}" style="font-weight:600;">${esc(cu?cu.customer_name:"—")}</td>
      ${typeFilter?"":`<td style="max-width:170px; white-space:normal;">${others}</td>`}
      <td class="mono">${due?esc(due.new_due_date):"—"}</td>
      <td class="mono">${fmt(total)}</td>
      <td style="max-width:200px; white-space:normal; font-size:12px;">${esc(n.reason||"—")}</td>
      <td>${esc(userName(n.user_id))}</td>
      <td style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" data-open="${n.customer_id}">التفاصيل</button>
        <button class="btn btn-outline btn-sm" data-quickfollowup="${n.customer_id}">${ICONS.plus}متابعة</button>
        <button class="btn btn-outline btn-sm" data-handleall="${n.customer_id}">تم التعامل</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="${typeFilter?7:8}" class="empty-state">لا توجد تنبيهات ${typeFilter?"من هذا النوع":"نشطة — كل شيء متابَع 👍"}</td></tr>`}
  </tbody></table></div>

  <div class="section-title">ذكرني (${reminders.length}) — قسم مستقل تماماً، لا يرتبط بالتنبيهات الأخرى</div>
  <div class="table-wrap"><table><thead><tr><th>العميل</th><th>التفاصيل</th><th>مسؤول</th><th></th></tr></thead><tbody>
  ${reminders.map(n=>{
    const cu=ST.customers.find(x=>x.id===n.customer_id);
    return `<tr>
      <td class="row-click" data-open="${n.customer_id}" style="font-weight:600;">${esc(cu?cu.customer_name:"—")}</td>
      <td style="max-width:280px; white-space:normal;">${esc(n.reason||"—")}</td>
      <td>${esc(userName(n.user_id))}</td>
      <td style="display:flex; gap:6px;">
        <button class="btn btn-outline btn-sm" data-open="${n.customer_id}">التفاصيل</button>
        <button class="btn btn-outline btn-sm" data-handlereminder="${n.id}">تم التعامل</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="4" class="empty-state">لا توجد تذكيرات مستحقة</td></tr>`}
  </tbody></table></div>`;

  const genBtn=$("#genBtn");
  if(genBtn) genBtn.addEventListener("click",async()=>{
    genBtn.disabled=true; genBtn.textContent="جاري التحديث...";
    const {data,error}=await sb.rpc("generate_notifications");
    if(error){ showToast("تعذر التحديث: "+error.message,true); genBtn.disabled=false; return; }
    await refreshTables(["notifications"]);
    const p=[]; if(data.inserted) p.push(`${data.inserted} تنبيه جديد`); if(data.removed_stale) p.push(`${data.removed_stale} أُزيل (انتهى سببه)`);
    showToast(p.length?`تم: ${p.join("، ")}`:"تم التحديث — لا تغييرات");
    render();
  });
  $("#genReminderBtn").addEventListener("click",()=>openReminderModal(null));
  const clearTypeBtn=$("#clearTypeBtn"); if(clearTypeBtn) clearTypeBtn.addEventListener("click",()=>{ ST.view.params={}; renderNotifications($("#content")); });
  $$("[data-typecard]").forEach(el=>el.addEventListener("click",async()=>{
    const t=el.dataset.typecard;
    await sb.from("notification_type_views").upsert({user_id:ST.currentUserId, notification_type:t, last_viewed_at:new Date().toISOString()},{onConflict:"user_id,notification_type"});
    await refreshTables(["notifTypeViews"]);
    if(t==="ذكرني"){ renderNotifications($("#content")); return; } // قسمها منفصل بالأسفل دائماً، ما تدخل الفلترة
    ST.view.params = typeFilter===t ? {} : {type:t};
    renderNotifications($("#content"));
  }));
  $$("[data-open]").forEach(el=>el.addEventListener("click",()=>navigate("detail",{id:el.dataset.open})));
  $$("[data-quickfollowup]").forEach(el=>el.addEventListener("click",()=>openFollowupModal(el.dataset.quickfollowup)));
  $$("[data-handleall]").forEach(el=>el.addEventListener("click",async()=>{
    const cid=el.dataset.handleall;
    const ids = typeFilter ? active.filter(n=>n.customer_id===cid && n.notification_type===typeFilter).map(n=>n.id)
                            : active.filter(n=>n.customer_id===cid).map(n=>n.id);
    if(!ids.length) return;
    const {error}=await sb.from("notifications").update({status:"تم التعامل",handled_at:new Date().toISOString()}).in("id",ids);
    if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
    await refreshTables(["notifications"]); showToast(`تم تعليم ${ids.length} تنبيه كمنجز`); render();
  }));
  $$("[data-handlereminder]").forEach(el=>el.addEventListener("click",async()=>{
    const {error}=await sb.from("notifications").update({status:"تم التعامل",handled_at:new Date().toISOString()}).eq("id",el.dataset.handlereminder);
    if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
    await refreshTables(["notifications"]); render();
  }));
}

/* ---------------------------- ميزة "ذكرني" ---------------------------- */
function openReminderModal(customerId){
  let selectedCustomerId=customerId||null;
  const cu=customerId?ST.customers.find(c=>c.id===customerId):null;
  const modal=$("#modalReminder");
  modal.innerHTML=`
  <div class="modal-header"><h2>ذكرني${cu?" — "+esc(cu.customer_name):""}</h2><span class="x" data-close="overlayReminder">✕</span></div>
  <div class="modal-body">
    ${!cu?`<div class="field" style="position:relative;">
      <label>العميل</label>
      <input type="text" id="remCustomerSearch" placeholder="اكتب اسم العميل أو رقمه للبحث..." autocomplete="off">
      <div id="remCustomerResults" style="display:none; position:absolute; z-index:20; background:#fff; border:1px solid var(--gray-200); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); max-height:220px; overflow-y:auto; width:100%; margin-top:2px;"></div>
      <input type="hidden" id="remCustomerId">
    </div>`:""}
    <div class="field"><label>ذكرني بعد كم يوم</label><input type="number" id="remDays" min="1" value="1"></div>
    <div class="field"><label>التفاصيل</label><textarea id="remDetails" rows="3" placeholder="مثال: يردني الاتصال به لزيارة الشركة"></textarea></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" data-close="overlayReminder">إلغاء</button>
    <button class="btn btn-primary" id="saveReminderBtn">حفظ التذكير</button>
  </div>`;
  $("#overlayReminder").classList.add("show");
  $$('[data-close="overlayReminder"]').forEach(el=>el.addEventListener("click",()=>$("#overlayReminder").classList.remove("show")));

  const searchInput=$("#remCustomerSearch");
  if(searchInput){
    const resultsBox=$("#remCustomerResults");
    const activeCustomers=visibleCustomers().filter(c=>c.is_active);
    searchInput.addEventListener("input",()=>{
      const q=searchInput.value.trim().toLowerCase();
      selectedCustomerId=null;
      if(!q){ resultsBox.style.display="none"; return; }
      const matches=activeCustomers.filter(c=>c.customer_name.toLowerCase().includes(q)||c.customer_number.includes(q)).slice(0,15);
      resultsBox.innerHTML = matches.length ? matches.map(c=>`
        <div class="remCustomerOption" data-id="${c.id}" data-name="${esc(c.customer_name)}" style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--gray-100);">
          ${esc(c.customer_name)} <span class="mono" style="color:var(--gray-500); font-size:11.5px;">(${esc(c.customer_number)})</span>
        </div>`).join("") : `<div style="padding:10px 12px; color:var(--gray-500); font-size:12.5px;">لا يوجد عميل مطابق</div>`;
      resultsBox.style.display="block";
      resultsBox.querySelectorAll(".remCustomerOption").forEach(el=>el.addEventListener("click",()=>{
        selectedCustomerId=el.dataset.id;
        searchInput.value=el.dataset.name;
        resultsBox.style.display="none";
      }));
    });
    searchInput.addEventListener("blur",()=>setTimeout(()=>{ resultsBox.style.display="none"; },150));
  }

  $("#saveReminderBtn").addEventListener("click",async(e)=>{
    const btn=e.currentTarget;
    if(btn.disabled) return; // حماية من الضغط المتكرر السريع (كان يُنشئ تذكيرات مكررة فعلياً)
    const targetCustomerId = customerId || selectedCustomerId;
    if(!targetCustomerId){ showToast("اختر عميلاً من نتائج البحث أولاً",true); return; }
    const days=parseInt($("#remDays").value)||1;
    const details=$("#remDetails").value.trim();
    if(!details){ showToast("التفاصيل مطلوبة",true); return; }
    btn.disabled=true; btn.textContent="جاري الحفظ...";
    const {error}=await sb.from("reminders").insert({customer_id:targetCustomerId, created_by:ST.currentUserId, remind_after_days:days, details});
    if(error){ showToast("تعذر الحفظ: "+error.message,true); btn.disabled=false; btn.textContent="حفظ التذكير"; return; }
    await refreshTables(["reminders"]); $("#overlayReminder").classList.remove("show"); showToast("تم حفظ التذكير"); render();
  });
}

function handleImportFile(file){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true});
      const result=parseBalancesSheet(rows);
      importPreviewCache={result,fileName:file.name};
      openImportPreview();
    }catch(err){
      showToast("تعذّرت قراءة الملف: "+err.message,true);
    }
  };
  reader.readAsArrayBuffer(file);
}

async function commitImport(){
  const {result,fileName}=importPreviewCache;
  const btn=$("#confirmImportBtn"); if(btn){ btn.disabled=true; btn.textContent="جاري الاستيراد..."; }
  try{
    const numbersInFile=[...new Set(result.rows.map(r=>r.customer_number))];
    const {data:existingBefore,error:exErr}=await sb.from("customers").select("customer_number").in("customer_number",numbersInFile);
    if(exErr) throw exErr;
    const existingNumbersBefore=(existingBefore||[]).map(c=>c.customer_number);

    // استيراد ذري واحد بقاعدة البيانات: إما تنجح كل الخطوات معاً (عملاء + أرصدة + قاعدة الرصيد القليل) أو تفشل كلها معاً
    const {data:rpcResult,error:rpcErr}=await sb.rpc("import_balances_transactional",{
      p_file_name:fileName,
      p_rows: result.rows.map(r=>({customer_number:r.customer_number, customer_name:r.customer_name, currency:r.currency, debit:r.debit, credit:r.credit})),
      p_existing_numbers_before: existingNumbersBefore,
      p_treat_as_initial: $("#initialMigrationChk")?.checked || false,
    });
    if(rpcErr) throw rpcErr;

    await refreshTables(["customers","balances","excelImports","incentives"]);
    $("#overlayImportPreview").classList.remove("show");
    showToast(`تم استيراد ${rpcResult.inserted} سجل${rpcResult.excluded_low_balance?` — استُبعد ${rpcResult.excluded_low_balance} عميل جديد برصيد قليل`:""}${rpcResult.hidden_low_balance?` — أُخفي ${rpcResult.hidden_low_balance} عميل موجود برصيد قليل`:""}${rpcResult.reactivated?` — أُعيد تنشيط ${rpcResult.reactivated} عميل رجع رصيده فوق الحد`:""}`);
    navigate("import");
  }catch(e){
    showToast("فشل الاستيراد بالكامل (لم يُحفظ أي جزء منه): "+e.message, true);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="تأكيد الاستيراد"; }
  }
}

async function commitFollowupImport(){
  const {result,fileName}=followupImportCache;
  const btn=$("#confirmFollowupImportBtn"); if(btn){ btn.disabled=true; btn.textContent="جاري الاستيراد..."; }
  try{
    const {data:importRow,error:impErr}=await sb.from("excel_imports").insert({
      file_name:fileName, file_type:"followups_and_customers", imported_by:ST.currentUserId, status:"نجاح",
      new_records_count:0, updated_records_count:0, error_count:result.warnings?.length||0,
      notes: result.warnings?.length ? `${result.warnings.length} تحذير أثناء الاستيراد` : null,
    }).select().single();
    if(impErr) throw impErr;

    const numbers=result.rows.map(r=>r.customer_number);
    const {data:existing,error:exErr}=await sb.from("customers").select("*").in("customer_number",numbers);
    if(exErr) throw exErr;
    const byNumber={}; (existing||[]).forEach(c=>byNumber[c.customer_number]=c);

    // فئات العملاء: لا تُنشأ تلقائياً بعد الآن. النص الخام من الإكسل يُحفظ لكل عميل، ويطابَق بالفئات الحقيقية
    // الموجودة فعلاً (عبر المرساة الثابتة source_category_name). أي اسم غير مطابق يبقى "بانتظار الإضافة"
    // ويظهر بالقائمة المنسدلة عند إضافة فئة جديدة يدوياً من شاشة الأداء والحوافز.
    const {data:existingCats}=await sb.from("customer_categories").select("id,source_category_name");
    const catBySource={}; (existingCats||[]).forEach(c=>{ if(c.source_category_name) catBySource[c.source_category_name]=c.id; });

    // مطابقة المتحصل بالاسم الكامل (تحديث غير هدّام: لا نغيّر إسناداً موجوداً إذا لم يُذكر مسؤول بالملف)
    const collectorByName={}; ST.users.forEach(u=>collectorByName[u.full_name.trim()]=u.id);

    let newCount=0, updatedCount=0; const unmatched=new Set(); const unmatchedCats=new Set();
    const newCustomerRows=[], updatePatches=[], dueDateRows=[];

    for(const r of result.rows){
      const ex=byNumber[r.customer_number];
      const patch={};
      if(r.customer_name) patch.customer_name=r.customer_name;
      if(r.mobile_1) patch.mobile_1=r.mobile_1; if(r.mobile_2) patch.mobile_2=r.mobile_2;
      if(r.guarantor) patch.guarantor=r.guarantor; if(r.customer_status) patch.customer_status=r.customer_status;
      if(r.category_name){
        if(catBySource[r.category_name]){ patch.customer_category_id=catBySource[r.category_name]; patch.pending_category_name=null; }
        else { patch.pending_category_name=r.category_name; unmatchedCats.add(r.category_name); }
      }
      if(r.assigned_collector_name){
        const uid2=collectorByName[r.assigned_collector_name];
        if(uid2) patch.assigned_user_id=uid2; else unmatched.add(r.assigned_collector_name);
      }
      if(ex){
        if(Object.keys(patch).length){ updatePatches.push({id:ex.id,patch}); updatedCount++; }
      }else{
        newCustomerRows.push({customer_number:r.customer_number, customer_name:r.customer_name||r.customer_number, is_active:true, ...patch});
        newCount++;
      }
    }
    if(newCustomerRows.length){ const {error}=await sb.from("customers").insert(newCustomerRows); if(error) throw error; }
    for(const {id,patch} of updatePatches){ const {error}=await sb.from("customers").update(patch).eq("id",id); if(error) throw error; }

    const {data:allNow,error:fetchErr}=await sb.from("customers").select("id,customer_number").in("customer_number",numbers);
    if(fetchErr) throw fetchErr;
    const idByNumber2={}; (allNow||[]).forEach(c=>idByNumber2[c.customer_number]=c.id);

    for(const r of result.rows){
      const cid=idByNumber2[r.customer_number]; if(!cid || !r.due_date) continue;
      dueDateRows.push({customer_id:cid, due_date:r.due_date, grace_1:r.grace_1, grace_2:r.grace_2, grace_3:r.grace_3, assigned_user_id: idByNumber2[r.customer_number]?( (byNumber[r.customer_number]||{}).assigned_user_id || collectorByName[r.assigned_collector_name] || null):null});
    }
    if(dueDateRows.length){
      const {error}=await sb.from("customer_due_dates").upsert(dueDateRows,{onConflict:"customer_id"});
      if(error) throw error;
    }

    await sb.from("excel_imports").update({new_records_count:newCount,updated_records_count:updatedCount}).eq("id",importRow.id);
    logActivity("import","excel_imports",importRow.id,null,{file_name:fileName,new:newCount,updated:updatedCount});
    await refreshTables(["customers","dueDates","categories","excelImports"]);
    $("#overlayImportPreview").classList.remove("show");
    showToast(`تم الاستيراد: ${newCount} عميل جديد، ${updatedCount} عميل محدَّث${unmatched.size?` — تحذير: أسماء متحصلين غير معروفة: ${[...unmatched].join("، ")}`:""}${unmatchedCats.size?` — فئات جديدة بانتظار إضافتها من شاشة الأداء والحوافز: ${[...unmatchedCats].join("، ")}`:""}`);
    navigate("import");
  }catch(e){
    showToast("فشل الاستيراد: "+e.message,true);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="تأكيد الاستيراد"; }
  }
}

function openPayIncentiveModal(userId){
  const u=ST.users.find(x=>x.id===userId);
  const due=ST.incentives.filter(i=>i.user_id===userId).reduce((s,i)=>s+Number(i.incentive_amount||0),0);
  const paid=ST.incentivePayments.filter(p=>p.user_id===userId).reduce((s,p)=>s+Number(p.amount||0),0);
  const remaining=due-paid;
  const modal=$("#modalCategory");
  modal.innerHTML=`
  <div class="modal-header"><h2>تسجيل صرف حافز — ${esc(u?.full_name||"")}</h2><span class="x" data-close="overlayCategory">✕</span></div>
  <div class="modal-body">
    <div style="font-size:12.5px; color:var(--gray-600); margin-bottom:10px;">المتبقي حالياً: <b class="mono">${fmt(remaining)}</b> ريال</div>
    <div class="field"><label>المبلغ المصروف</label><input type="text" inputmode="decimal" id="payAmount" placeholder="0.00"></div>
    <div class="field"><label>تاريخ الصرف</label><input type="date" id="payDate" value="${todayStr()}"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><input type="text" id="payNotes" placeholder="مثال: صرف نقدي، تحويل بنكي..."></div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" data-close="overlayCategory">إلغاء</button>
    <button class="btn btn-primary" id="savePayBtn">حفظ</button>
  </div>`;
  $("#overlayCategory").classList.add("show");
  $$('[data-close="overlayCategory"]').forEach(el=>el.addEventListener("click",()=>$("#overlayCategory").classList.remove("show")));
  $("#savePayBtn").addEventListener("click",async(e)=>{
    const btn=e.currentTarget; if(btn.disabled) return;
    const amount=parseFloat($("#payAmount").value);
    if(!amount || amount<=0){ showToast("أدخل مبلغاً صحيحاً",true); return; }
    if(amount>remaining && !confirm(`المبلغ المدخل (${fmt(amount)}) أكبر من المتبقي المستحق (${fmt(remaining)}) — تأكيد الصرف رغم ذلك؟`)) return;
    btn.disabled=true; btn.textContent="جاري الحفظ...";
    const {error}=await sb.from("incentive_payments").insert({user_id:userId, amount, payment_date:$("#payDate").value||todayStr(), paid_by:ST.currentUserId, notes:$("#payNotes").value.trim()||null});
    if(error){ showToast("تعذر الحفظ: "+error.message,true); btn.disabled=false; btn.textContent="حفظ"; return; }
    logActivity("create","incentive_payments",userId,null,{amount});
    await refreshTables(["incentives"]); $("#overlayCategory").classList.remove("show"); showToast("تم تسجيل الصرف"); render();
  });
}

async function saveSettingsBatch(fields){
  const rows=Object.entries(fields).map(([key,[value,type]])=>({
    setting_key:key, setting_value: JSON.stringify(value),
    data_type:type, category:(fields[key][3])||"عام", updated_by:ST.currentUserId,
  }));
  const {error}=await sb.from("settings").upsert(rows,{onConflict:"setting_key"});
  if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
  // تسجيل دقيق للقيمة القديمة والجديدة الفعلية لكل إعداد تغيّر فعلياً (وليس تسجيلاً عاماً غامضاً)
  for(const [key,[newVal,,oldVal]] of Object.entries(fields)){
    if(oldVal!==undefined && oldVal!==newVal){
      logActivity("update","settings",key,{[key]:oldVal},{[key]:newVal});
    }
  }
  await refreshTables(["settings"]);
  showToast("تم حفظ الإعدادات بنجاح");
  renderSettings($("#content"));
}

function simpleBarChartHTML(items, opts){
  // items: [{label, value, color}] — رسم بسيط بأعمدة أفقية بدون مكتبة خارجية (يطابق هوية المشروع)
  const max=Math.max(1, ...items.map(i=>i.value));
  return `<div style="display:flex; flex-direction:column; gap:10px;">
    ${items.map(i=>`
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px;">
          <span>${esc(i.label)}</span><span class="mono" style="font-weight:600;">${opts&&opts.fmt==="money"?fmt(i.value):i.value}</span>
        </div>
        <div style="background:var(--gray-100); border-radius:4px; height:10px; overflow:hidden;">
          <div style="width:${Math.max(2,(i.value/max*100))}%; height:100%; background:${i.color||'var(--blue-500)'}; border-radius:4px;"></div>
        </div>
      </div>`).join("")}
  </div>`;
}
function exportRowsToExcel(rows, filename){
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "تقرير");
  XLSX.writeFile(wb, filename);
}

      customer_name:name, mobile_1:$("#mMobile1").value.trim(), mobile_2:$("#mMobile2").value.trim(),

      customer_category_id:$("#mCategory").value||null, assigned_user_id:$("#mAssigned").value||null,
      description:$("#mDesc").value.trim(),
    };
    if(isEdit){
      const old={...existing};
      const {error}=await sb.from("customers").update(patch).eq("id",existing.id);
      if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
      logActivity("update","customers",existing.id,old,patch);
    }else{
      const num=$("#mNumber").value.trim();
      if(!num){ showToast("رقم العميل مطلوب",true); return; }
      if(ST.customers.some(c=>c.customer_number===num)){ showToast("رقم العميل موجود مسبقاً",true); return; }

      logActivity("create","customers",data.id,null,patch);
    }

  });
}

function permissionSectionHTML(existing){
  const screens=Array.from(new Set([...Object.keys(ACTION_CATALOG),...Object.keys(FIELD_CATALOG)]));
  const baseRole = existing ? roleName(existing) : roleName({role_id: $("#uRole")?.value || ST.roles[0].id});
  return screens.map(screen=>{
    const actions=ACTION_CATALOG[screen]||[];
    const fields=FIELD_CATALOG[screen]||[];
    const sp = existing && existing.screen_permissions && existing.screen_permissions[screen];
    const actionsHTML = actions.length ? `
      <div style="font-size:11px; color:var(--gray-500); font-weight:600; margin-bottom:5px;">الإجراءات المسموحة</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px 14px; margin-bottom:${fields.length?"10px":"0"};">
        ${actions.map(a=>{
          const explicit = sp && sp.actions && Object.prototype.hasOwnProperty.call(sp.actions,a.key);
          const checked = explicit ? sp.actions[a.key] : roleDefaultAction(baseRole, screen, a.key);
          return `<label style="display:flex; align-items:center; gap:5px; font-weight:400; font-size:12px;">
            <input type="checkbox" class="permAction" data-screen="${screen}" data-action="${a.key}" ${checked?"checked":""}> ${esc(a.label)}
          </label>`;
        }).join("")}
      </div>` : "";
    const fieldsHTML = fields.length ? `
      <div style="font-size:11px; color:var(--gray-500); font-weight:600; margin-bottom:5px;">الأعمدة الظاهرة بالجدول</div>
      <div style="display:flex; flex-wrap:wrap; gap:4px 14px;">
        ${fields.map(f=>{
          const hidden = sp && sp.hidden_fields && sp.hidden_fields.includes(f.key);
          return `<label style="display:flex; align-items:center; gap:5px; font-weight:400; font-size:12px;">
            <input type="checkbox" class="permField" data-screen="${screen}" data-field="${f.key}" ${hidden?"":"checked"}> ${esc(f.label)}
          </label>`;
        }).join("")}
      </div>` : "";
    if(!actionsHTML && !fieldsHTML) return "";
    return `<div style="border:1px solid var(--gray-200); border-radius:6px; padding:10px 12px; margin-bottom:8px;">
      <div style="font-size:12.5px; font-weight:700; margin-bottom:8px;">${esc(SCREEN_LABELS[screen]||screen)}</div>
      ${actionsHTML}${fieldsHTML}
    </div>`;
  }).join("");
}

      <label>الشاشات المسموح للمستخدم الوصول إليها</label>
      <div id="screensBox" style="display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; border:1px solid var(--gray-200); border-radius:6px; padding:10px 12px;">
        ${ALL_SCREENS.map(s=>`<label style="display:flex; align-items:center; gap:6px; font-weight:400; font-size:12.5px; margin-bottom:2px;">
          <input type="checkbox" class="uScreen" value="${s}" ${currentScreens.includes(s)?"checked":""}> ${esc(SCREEN_LABELS[s])}
        </label>`).join("")}
      </div>
    </div>

    <div class="field">
      <label>فئات العملاء المسموح للمستخدم برؤيتها (بدون تحديد = كل الفئات)</label>
      <div id="categoriesBox" style="display:flex; flex-direction:column; gap:4px; border:1px solid var(--gray-200); border-radius:6px; padding:10px 12px;">
        ${ST.customerCategories.map(cc=>`<label style="display:flex; align-items:center; gap:6px; font-weight:400; font-size:12.5px;">
          <input type="checkbox" class="uCategory" value="${cc.id}" ${currentCats.includes(cc.id)?"checked":""}>
          <span class="cat-dot" style="background:${cc.color}"></span> ${esc(cc.category_name)}
        </label>`).join("")}
      </div>
    </div>
    <div style="font-size:11px; color:var(--gray-500); margin-bottom:14px;">ملاحظة: مسؤول التحصيل يرى فقط عملاءه المُعيَّن عليهم + ضمن الفئات المحددة هنا (كلا الشرطين معاً).</div>

    <div class="field">
      <label>صلاحيات تفصيلية داخل كل شاشة (إجراءات مسموحة + أعمدة ظاهرة)</label>
      <div id="permSections">${permissionSectionHTML(existing)}</div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" data-close="overlayUser">إلغاء</button>
    <button class="btn btn-primary" id="saveUserBtn">حفظ</button>
  </div>`;
  $("#overlayUser").classList.add("show");
  $$('[data-close="overlayUser"]').forEach(el=>el.addEventListener("click",()=>$("#overlayUser").classList.remove("show")));
  const roleSel=$("#uRole");
  if(roleSel) roleSel.addEventListener("change",()=>{ $("#permSections").innerHTML=permissionSectionHTML(existing); });
  const copyBtn=$("#copyPermsBtn");
  if(copyBtn) copyBtn.addEventListener("click",()=>{
    const srcId=$("#copyFromUser").value;
    if(!srcId){ showToast("اختر مستخدماً أولاً",true); return; }
    const src=ST.users.find(u=>u.id===srcId);
    // 1) الدور
    $("#uRole").value=src.role_id;
    // 2) الشاشات
    $$(".uScreen").forEach(cb=>{ cb.checked=allowedScreens(src).includes(cb.value); });
    // 3) فئات العملاء
    const srcCats=allowedCategoryIds(src);
    $$(".uCategory").forEach(cb=>{ cb.checked=srcCats.includes(cb.value); });
    // 4) الصلاحيات التفصيلية (إجراءات + أعمدة ظاهرة) — نعيد رسم القسم بالكامل من صلاحيات المصدر الفعلية
    $("#permSections").innerHTML=permissionSectionHTML(src);
    showToast(`تم نسخ صلاحيات "${src.full_name}" — راجعها وعدّل ما تحتاجه ثم اضغط حفظ`);
  });
  $("#saveUserBtn").addEventListener("click",async()=>{
    const full_name=$("#uName").value.trim();
    if(!full_name){ showToast("الاسم مطلوب",true); return; }
    const role_id=$("#uRole").value;
    const phone=$("#uPhone").value.trim();
    const selectedScreens=[...$$(".uScreen")].filter(cb=>cb.checked).map(cb=>cb.value);
    const selectedCats=[...$$(".uCategory")].filter(cb=>cb.checked).map(cb=>cb.value);
    const actionChecks=[...$$(".permAction")].map(cb=>({screen:cb.dataset.screen,action:cb.dataset.action,checked:cb.checked}));
    const fieldChecks=[...$$(".permField")].map(cb=>({screen:cb.dataset.screen,field:cb.dataset.field,checked:cb.checked}));

    const btn=$("#saveUserBtn"); btn.disabled=true; btn.textContent="جاري الحفظ...";
    try{
      let userId=existing?.id;
      if(!isEdit){
        const email=$("#uUsername").value.trim();
        const password=$("#uPassword").value.trim();
        if(!email){ showToast("البريد الإلكتروني مطلوب",true); btn.disabled=false; btn.textContent="حفظ"; return; }
        if(!password || password.length<8){ showToast("كلمة المرور يجب ألا تقل عن 8 أحرف",true); btn.disabled=false; btn.textContent="حفظ"; return; }
        const {data:{session}}=await sb.auth.getSession();
        const resp=await fetch(SUPABASE_URL+"/functions/v1/admin-create-user",{
          method:"POST",
          headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},
          body:JSON.stringify({email,password,full_name,phone,role_id}),
        });
        const out=await resp.json();
        if(!resp.ok) throw new Error(out.error||"تعذر إنشاء المستخدم");
        userId=out.id;
        logActivity("create","users",userId,null,{email,full_name,role_id});
      }else{
        const old={role_id:existing.role_id, phone:existing.phone, full_name:existing.full_name};
        const {error}=await sb.from("users").update({full_name, phone, role_id}).eq("id",userId);
        if(error) throw error;
        logActivity("update","users",userId,old,{full_name,phone,role_id});
      }

      // فئات العملاء المسموحة: استبدال كامل بما تم اختياره الآن
      await sb.from("user_allowed_categories").delete().eq("user_id",userId);
      if(selectedCats.length) await sb.from("user_allowed_categories").insert(selectedCats.map(cid=>({user_id:userId,category_id:cid})));

      // الصلاحيات الفردية (شاشات + إجراءات): تُكتب كاستثناء فقط عندما تختلف عن الافتراضي حسب الدور المختار
      await sb.from("user_permission_overrides").delete().eq("user_id",userId);
      const {data:allPerms}=await sb.from("permissions").select("id,permission_key");
      const keyToId={}; (allPerms||[]).forEach(p=>keyToId[p.permission_key]=p.id);
      const overrides=[];
      ALL_SCREENS.forEach(s=>{
        const isAllowed=selectedScreens.includes(s);
        if(keyToId["screen."+s]) overrides.push({user_id:userId, permission_id:keyToId["screen."+s], is_allowed:isAllowed});
      });
      actionChecks.forEach(({screen,action,checked})=>{
        const entry=(ACTION_CATALOG[screen]||[]).find(a=>a.key===action);
        const key=entry?entry.permKey:null;
        if(key && keyToId[key]) overrides.push({user_id:userId, permission_id:keyToId[key], is_allowed:checked});
      });
      if(overrides.length) await sb.from("user_permission_overrides").insert(overrides);

      // الحقول المخفية بكل شاشة
      await sb.from("user_field_overrides").delete().eq("user_id",userId);
      const hiddenRows=fieldChecks.filter(f=>!f.checked).map(f=>({user_id:userId, screen_key:f.screen, field_key:f.field, can_view:false, can_edit:false}));
      if(hiddenRows.length) await sb.from("user_field_overrides").insert(hiddenRows);

      await refreshTables(["users"]); $("#overlayUser").classList.remove("show"); showToast("تم الحفظ");
      render();
    }catch(e){
      showToast("تعذر الحفظ: "+e.message, true);
    }finally{
      btn.disabled=false; btn.textContent="حفظ";
    }
  });
}

async function openCategoryModal(existing){
  const isEdit=!!existing;
  const modal=$("#modalCategory");

  let pendingOptions=[];
  if(!isEdit){
    const {data:pendingRows}=await sb.from("customers").select("pending_category_name").not("pending_category_name","is",null);
    const counts={};
    (pendingRows||[]).forEach(r=>{ counts[r.pending_category_name]=(counts[r.pending_category_name]||0)+1; });
    pendingOptions=Object.entries(counts).map(([name,count])=>({name,count}));
  }

  modal.innerHTML=`
  <div class="modal-header"><h2>${isEdit?"تعديل فئة — "+esc(existing.category_name):"فئة عملاء جديدة"}</h2><span class="x" data-close="overlayCategory">✕</span></div>
  <div class="modal-body">
    ${isEdit?`
      <div class="field"><label>اسم الفئة</label><input type="text" value="${esc(existing.category_name)}" disabled></div>
      <div style="font-size:11px; color:var(--gray-500); margin-bottom:10px;">اسم الفئة مربوط بملف Excel ولا يمكن تعديله من هنا — يمنع حدوث تكرار عند الاستيراد اللاحق.</div>
    `:`
      ${pendingOptions.length?`
        <div class="field"><label>اسم الفئة (من الأسماء المكتشفة بملف الإكسل ولم تُضَف بعد)</label>
          <select id="catNameSelect">${pendingOptions.map(o=>`<option value="${esc(o.name)}">${esc(o.name)} (${o.count} عميل بانتظارها)</option>`).join("")}</select>
        </div>
        <div style="font-size:11px; color:var(--gray-500); margin-bottom:10px;">بعد الحفظ سيُربط كل العملاء اللي فئتهم بالإكسل تطابق هذا الاسم بالفئة الجديدة تلقائياً.</div>
      `:`
        <div class="empty-state" style="padding:20px 10px;">ما فيه أسماء فئات جديدة مكتشفة بعد.<br><span style="font-size:11.5px;">أضف اسم الفئة بعمود "فئة العملاء" بملف Excel، ثم استورد ملف "بيانات العملاء والاستحقاق" من جديد — بعدها يظهر الاسم هنا تلقائياً.</span></div>
      `}
    `}
    <div class="field"><label>اللون</label><input type="color" id="catColor" value="${existing?.color||"#2563EB"}" style="height:38px;"></div>
    <div class="field"><label>نسبة الحافز %</label><input type="text" inputmode="decimal" id="catRate" value="${existing?existing.incentive_rate:""}" placeholder="مثال: 2.5"></div>
    ${isEdit?`<div style="font-size:11px; color:var(--gray-500); margin-bottom:8px;">تغيير النسبة لا يؤثر على حوافز محسوبة سابقاً — يُحفظ تاريخ النسب تلقائياً.</div>
    <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="catActive" ${existing.is_active?"checked":""}> الفئة نشطة</label>`:""}
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" data-close="overlayCategory">إلغاء</button>
    ${isEdit || pendingOptions.length ? `<button class="btn btn-primary" id="saveCatBtn">حفظ</button>` : ""}
  </div>`;
  $("#overlayCategory").classList.add("show");
  $$('[data-close="overlayCategory"]').forEach(el=>el.addEventListener("click",()=>$("#overlayCategory").classList.remove("show")));
  const saveBtn=$("#saveCatBtn");
  if(!saveBtn) return;
  saveBtn.addEventListener("click",async()=>{
    const rate=parseFloat($("#catRate").value)||0;
    const color=$("#catColor").value;

    if(isEdit){
      const old={incentive_rate:existing.incentive_rate, color:existing.color, is_active:existing.is_active};
      const isActive=$("#catActive").checked;
      const {error}=await sb.from("customer_categories").update({color, incentive_rate:rate, is_active:isActive}).eq("id",existing.id);
      if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
      if(rate!==existing.incentive_rate){
        await sb.from("customer_category_rate_history").update({effective_to:todayStr()}).eq("category_id",existing.id).is("effective_to",null);
        await sb.from("customer_category_rate_history").insert({category_id:existing.id, incentive_rate:rate});
      }
      logActivity("update","customer_categories",existing.id,old,{incentive_rate:rate, color, is_active:isActive});
      showToast("تم حفظ التعديلات");
    }else{
      const name=$("#catNameSelect").value;
      const {data,error}=await sb.from("customer_categories").insert({category_name:name, source_category_name:name, color, incentive_rate:rate, is_active:true}).select().single();
      if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
      await sb.from("customer_category_rate_history").insert({category_id:data.id, incentive_rate:rate});
      // ربط كل العملاء الذين كانت فئتهم بانتظار الإضافة بهذا الاسم بالفئة الجديدة فوراً
      await sb.from("customers").update({customer_category_id:data.id, pending_category_name:null}).eq("pending_category_name",name);
      logActivity("create","customer_categories",data.id,null,{name,rate});
      showToast("تم إضافة الفئة وربط عملائها");
    }
    await refreshTables(["categories"]); $("#overlayCategory").classList.remove("show"); render();
  });
}
