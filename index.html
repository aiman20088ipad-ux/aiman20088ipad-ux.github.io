<style>
:root{
  --blue-50:#EAF2FE; --blue-100:#D3E4FC; --blue-500:#3B6FF0; --blue-600:#2F5FE0; --blue-700:#2447B8; --blue-900:#0E1636;
  --navy-900:#0B1130; --navy-800:#121A42; --navy-700:#1A2554;
  --gray-25:#FAFBFC; --gray-50:#F5F6F8; --gray-100:#ECEEF1; --gray-200:#DDE1E6; --gray-300:#C3C9D1;
  --gray-500:#8A93A0; --gray-600:#5F6874; --gray-700:#414952; --gray-900:#1B2027;
  --green-500:#16A34A; --green-50:#EAFBF0; --amber-500:#D97706; --amber-50:#FEF6E7; --red-500:#DC2626; --red-50:#FDECEC;
  --white:#FFFFFF; --radius:12px; --radius-sm:8px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 4px 14px rgba(16,24,40,.08);
  /* ألوان أنواع التنبيهات — نفس اللون يُستخدم بالبطاقة والشارة معاً لتناسق بصري */
  --t-before-fg:#E23F6B; --t-before-bg:#FDEAF1;
  --t-today-fg:#E23F3F; --t-today-bg:#FDEAEA;
  --t-shopping-fg:#EF8C3C; --t-shopping-bg:#FDEEE0;
  --t-promise-fg:#3E7BFA; --t-promise-bg:#EAF1FE;
  --t-stale-fg:#DFA22E; --t-stale-bg:#FCF3DE;
  --t-escalate-fg:#8B5CF6; --t-escalate-bg:#F1ECFE;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'IBM Plex Sans Arabic',sans-serif; background:var(--gray-50); color:var(--gray-900); font-size:14px;}
.mono{font-variant-numeric:tabular-nums; font-weight:600; letter-spacing:.1px;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
svg{display:block;}

#shell{display:flex; min-height:100vh;}

/* Sidebar */
#sidebar{
  width:238px; background:linear-gradient(180deg,var(--navy-700),var(--navy-900)); color:#AEB9E0; flex-shrink:0;
  display:flex; flex-direction:column; padding:18px 0 14px;
}
.sidebar-profile{padding:4px 18px 18px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:10px;}
.sidebar-profile .avatar{
  width:52px; height:52px; border-radius:50%; background:linear-gradient(135deg,var(--blue-500),#6C4CF5);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700;
  margin:0 auto 8px; position:relative;
}
.sidebar-profile .avatar .dot{position:absolute; bottom:1px; left:1px; width:11px; height:11px; border-radius:50%; background:var(--green-500); border:2px solid var(--navy-800);}
.sidebar-profile .name{color:#fff; font-size:13.5px; font-weight:700;}
.sidebar-profile .role{color:#8E9BD1; font-size:11px; margin-top:2px;}
.nav-item{
  padding:10px 16px; margin:2px 10px; border-radius:10px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:10px;
  color:#AEB9E0; transition:all .12s; position:relative;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.07); color:#fff;}
.nav-item.active{background:var(--blue-600); color:#fff; font-weight:600; box-shadow:0 2px 8px rgba(47,95,224,.4);}
.nav-item.active svg{opacity:1;}
.nav-item .item-badge{margin-inline-start:auto; background:var(--t-today-fg); color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 6px; min-width:16px; text-align:center;}
.sidebar-bottom{margin-top:auto; padding:10px 10px 0;}
.sidebar-bottom .nav-item{color:#8E9BD1;}

/* Main */
#main{flex:1; display:flex; flex-direction:column; min-width:0;}
#topbar{
  background:var(--white); border-bottom:1px solid var(--gray-200); padding:14px 26px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
#topbar h1{font-size:19px; font-weight:700;}
#topbar .crumb{font-size:11.5px; color:var(--gray-500); margin-top:2px;}
.role-switch{display:flex; align-items:center; gap:10px; font-size:12px; color:var(--gray-600);}
.badge-role{padding:3px 11px; border-radius:20px; font-size:11px; font-weight:600; background:var(--blue-50); color:var(--blue-700);}

#content{flex:1; padding:24px 26px; overflow-x:hidden;}

/* Cards / stats */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-card{background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow);}
.stat-card .lbl{font-size:12px; color:var(--gray-600); margin-bottom:6px;}
.stat-card .val{font-size:26px; font-weight:700; color:var(--blue-700); font-variant-numeric:tabular-nums;}
.stat-card .val.danger{color:var(--red-500);}
.stat-card .sub{font-size:11px; color:var(--gray-500); margin-top:4px;}

/* بطاقات ملونة بأيقونة (مركز التنبيهات وما شابه) */
.type-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:20px;}
.type-card{
  background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius); padding:14px 16px 12px;
  box-shadow:var(--shadow); cursor:pointer; transition:box-shadow .15s, transform .1s; text-align:right;
}
.type-card:hover{box-shadow:var(--shadow-md); transform:translateY(-1px);}
.type-card.active{border-color:var(--blue-500); box-shadow:0 0 0 2px var(--blue-100);}
.type-card .icon-badge{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;}
.type-card .icon-badge svg{width:18px; height:18px;}
.type-card .t-label{font-size:12px; font-weight:600; color:var(--gray-700); margin-bottom:6px; min-height:32px;}
.type-card .t-val{font-size:22px; font-weight:700; color:var(--gray-900); font-variant-numeric:tabular-nums;}
.type-card .t-unit{font-size:11px; color:var(--gray-500); margin-bottom:8px;}
.type-card .t-link{font-size:11px; color:var(--blue-600); font-weight:600;}
@media (max-width:1200px){.type-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:640px){.type-grid{grid-template-columns:repeat(2,1fr);}}

.section-title{font-size:14px; font-weight:600; margin:22px 0 10px; color:var(--gray-900);}
.section-title:first-child{margin-top:0;}

/* Table */
.table-wrap{background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius); overflow-x:auto; -webkit-overflow-scrolling:touch; box-shadow:var(--shadow);}
.table-wrap table{min-width:640px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{background:var(--gray-50); text-align:right; padding:11px 14px; font-weight:700; color:var(--gray-600); font-size:11.5px; border-bottom:1px solid var(--gray-200); white-space:nowrap;}
tbody td{padding:13px 14px; border-bottom:1px solid var(--gray-100); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--gray-25);}
.row-click{cursor:pointer;}

.pill{display:inline-flex; align-items:center; gap:4px; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700;}
.pill-green{background:var(--green-50); color:var(--green-500);}
.pill-amber{background:var(--amber-50); color:var(--amber-500);}
.pill-red{background:var(--red-50); color:var(--red-500);}
.pill-gray{background:var(--gray-100); color:var(--gray-600);}
.pill-blue{background:var(--blue-50); color:var(--blue-700);}

.cat-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px;}

/* Toolbar */
.toolbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.toolbar input[type=text], .toolbar select, .toolbar input[type=date]{
  padding:8px 12px; border:1px solid var(--gray-200); border-radius:20px; background:var(--white); font-size:13px;
}
.toolbar input[type=text]{flex:1; min-width:180px;}
.btn{padding:8px 16px; border-radius:20px; font-size:13px; font-weight:600; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px;}
.btn svg{width:14px; height:14px;}
.btn-primary{background:var(--blue-600); color:#fff;}
.btn-primary:hover{background:var(--blue-700);}
.btn-outline{background:var(--white); border-color:var(--gray-300); color:var(--gray-700);}
.btn-outline:hover{background:var(--gray-50);}
.btn-sm{padding:5px 13px; font-size:12px;}
.btn-danger{background:var(--red-50); color:var(--red-500); border-color:var(--red-50);}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(20,24,30,0.5); display:none; align-items:center; justify-content:center; z-index:100; padding:16px;}
.overlay.show{display:flex;}
.modal{background:var(--white); border-radius:10px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.modal.wide{max-width:640px;}
.modal-header{padding:16px 20px; border-bottom:1px solid var(--gray-100); display:flex; justify-content:space-between; align-items:center;}
.modal-header h2{font-size:15px; font-weight:600;}
.modal-header .x{cursor:pointer; color:var(--gray-500); font-size:18px; line-height:1;}
.modal-body{padding:18px 20px;}
.modal-footer{padding:14px 20px; border-top:1px solid var(--gray-100); display:flex; justify-content:flex-end; gap:8px;}
.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--gray-600); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--gray-200); border-radius:6px; font-size:13px; background:var(--white);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--blue-500);}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}

/* Detail page */
.detail-header{background:var(--white); border:1px solid var(--gray-200); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; box-shadow:var(--shadow);}
.detail-grid{display:grid; grid-template-columns:2fr 1fr; gap:18px;}
.info-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--gray-100); font-size:13px;}
.info-row:last-child{border-bottom:none;}
.info-row .k{color:var(--gray-600);}
.info-row .v{font-weight:600;}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--gray-200); margin-bottom:14px;}
.tab-btn{padding:9px 16px; font-size:13px; font-weight:600; color:var(--gray-500); border-bottom:2px solid transparent; background:none; border-top:none;border-right:none;border-left:none;}
.tab-btn.active{color:var(--blue-700); border-bottom-color:var(--blue-600);}

.empty-state{text-align:center; padding:50px 20px; color:var(--gray-500); font-size:13px;}
.back-link{font-size:13px; color:var(--blue-600); font-weight:600; cursor:pointer; margin-bottom:14px; display:inline-block;}

.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--gray-900); color:#fff; padding:10px 20px; border-radius:6px; font-size:13px; opacity:0; transition:all .25s; z-index:200; pointer-events:none;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.err{background:var(--red-500);}

.log-line{font-size:12px; padding:9px 14px; border-bottom:1px solid var(--gray-100); display:flex; gap:10px;}
.log-line .who{font-weight:600; min-width:90px;}
.log-line .what{color:var(--gray-600); flex:1;}
.log-line .when{color:var(--gray-500);}

.dropzone{border:2px dashed var(--gray-300); border-radius:var(--radius); padding:34px; text-align:center; color:var(--gray-500); font-size:13px; background:var(--white);}
.dropzone input{display:none;}

@media (max-width:900px){
  #sidebar{position:fixed; inset-inline-start:0; top:0; bottom:0; width:260px; z-index:200; transform:translateX(100%); transition:transform .25s ease; box-shadow:0 0 40px rgba(0,0,0,.3);}
  #sidebar.open{transform:translateX(0);}
  #sidebarBackdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:190;}
  #sidebarBackdrop.show{display:block;}
  #menuToggle{display:inline-flex !important;}
  #shell{display:block !important;}
  .stat-grid{grid-template-columns:1fr 1fr;} .detail-grid{grid-template-columns:1fr;}
  .grid-2{grid-template-columns:1fr;}
  .modal{max-width:100% !important; width:100%; height:100%; max-height:100%; border-radius:0; display:flex; flex-direction:column;}
  .modal-body{flex:1; overflow-y:auto;}
  .overlay{padding:0;}
  .btn{min-height:40px; padding:10px 16px; font-size:14px;}
  .btn-sm{min-height:34px;}
  input, select, textarea{font-size:16px !important;} /* يمنع تكبير آيفون التلقائي المزعج عند التركيز على حقل */
  #topbar{padding:10px 14px;}
  #topbar h1{font-size:16px;}
}

/* Login screen */
#loginScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--blue-900); padding:16px;}
.login-card{background:var(--white); border-radius:12px; width:100%; max-width:380px; padding:28px 26px; box-shadow:0 20px 60px rgba(0,0,0,0.3);}
.login-card h1{font-size:16px; font-weight:700; margin-bottom:2px;}
.login-card .sub{font-size:12px; color:var(--gray-500); margin-bottom:18px;}
.login-warning{background:var(--amber-50); color:#8A5A00; border:1px solid #F0D9A8; border-radius:6px; padding:10px 12px; font-size:11.5px; line-height:1.6; margin-bottom:18px;}
.login-error{background:var(--red-50); color:var(--red-500); border-radius:6px; padding:8px 12px; font-size:12px; margin-bottom:12px; display:none;}
.login-error.show{display:block;}
.login-hint{margin-top:18px; padding-top:14px; border-top:1px solid var(--gray-100); font-size:11px; color:var(--gray-500);}
.login-hint table{width:100%; margin-top:6px; border-collapse:collapse;}

<script>
/* ============================================================================

   كل قراءة/كتابة تمر عبر RLS المفعّلة على مستوى قاعدة البيانات حسب دور
   المستخدم وصلاحياته الفردية، وليس مجرد إخفاء بالواجهة فقط.
   ============================================================================ */
const SUPABASE_URL="https://snwcbgljqwzjxshgkwkp.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNud2NiZ2xqcXd6anhzaGdrd2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDM3NzIsImV4cCI6MjEwMTcxOTc3Mn0.Ym28RiBPQM1aBRUyQ4B8NMNIvqkkk6ZqGb0RrHCw-kI";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
/* ============================================================================
   منطق العمل الصافي — مطابق حرفياً لملف logic.js الذي تم اختباره بـ 22 اختبار
   قبل تضمينه هنا (راجع test_logic.js المرفق منفصلاً)
   ============================================================================ */
function daysBetween(a,b){const MS=86400000; return Math.round((new Date(b)-new Date(a))/MS);}
function addDays(dateStr,days){const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+Number(days||0)); return localDateStr(d);}
function calcRemainingDays(newDueDate,today){return daysBetween(today,newDueDate);}
function calcTotalDueYER(usd,sar,yer,rateUsd,rateSar){return (Number(usd)||0)*(Number(rateUsd)||0)+(Number(sar)||0)*(Number(rateSar)||0)+(Number(yer)||0);}

// ملاحظة: توليد التنبيهات محلياً بالواجهة أُزيل نهائياً — يُستخدم الآن حصراً محرك generate_notifications()
// الحقيقي بقاعدة البيانات (عبر sb.rpc)، لضمان اتساق القاعدة بين كل المستخدمين والتوليد التلقائي اليومي.

const EXPECTED_COLUMNS=["رقم العميل","اسم العميل","مدين","دائن","ملاحظات"];
const CURRENCY_ORDER=["YER","USD","SAR"]; // الترتيب الرسمي المعتمد: يمني ثم دولار ثم سعودي

// اكتشاف صف رأس كل قسم ديناميكياً بدل الاعتماد على أرقام صفوف ثابتة (651/1041 كانت تشير
// لصف عنوان القسم فعلياً وليس رأس الأعمدة، واكتشفنا هذا من الملف الرسمي الحقيقي)
function findSectionHeaderRows(rows){
  const headerRows=[];
  for(let r=0;r<rows.length;r++){
    const row=rows[r]||[];
    const c0=String(row[0]??"").trim(), c1=String(row[1]??"").trim();
    if(c0==="رقم العميل" && c1==="اسم العميل") headerRows.push(r);
  }
  return headerRows;
}

function detectCurrencyFromText(txt){
  const t=String(txt||"").replace(/\s/g,"");
  if(t.includes("يمني")) return "YER";
  if(t.includes("دولار")) return "USD";
  if(t.includes("سعودي")) return "SAR";
  return null;
}
function normalizeCustomerNumber(n){ return String(n??"").trim().replace(/^0+(?=\d)/,""); }

function parseBalancesSheet(rows){
  const errors=[],warnings=[],parsed=[],counts={YER:0,USD:0,SAR:0},sections=[];
  const headerRows=findSectionHeaderRows(rows);
  if(!headerRows.length){
    errors.push(`لم يتم العثور على أي قسم. تأكد أن كل قسم يبدأ بصف رؤوس أعمدة مطابق تماماً: "رقم العميل، اسم العميل، مدين، دائن، ملاحظات"`);
    return {ok:false,errors,warnings,rows:parsed,counts,sections};
  }
  headerRows.forEach((headerIdx,i)=>{
    const headerRow=(rows[headerIdx]||[]).map(h=>String(h??"").trim());
    const missing=EXPECTED_COLUMNS.filter(c=>!headerRow.includes(c));
    if(missing.length){ errors.push(`قسم بالصف ${headerIdx+1}: أعمدة مفقودة: ${missing.join("، ")}`); return; }
    const idx={number:headerRow.indexOf("رقم العميل"),name:headerRow.indexOf("اسم العميل"),debit:headerRow.indexOf("مدين"),credit:headerRow.indexOf("دائن"),notes:headerRow.indexOf("ملاحظات")};
    const endRow = i+1<headerRows.length ? headerRows[i+1] : rows.length;
    let sectionCurrency=null;
    // العملة الموثوقة تُقرأ من نص عمود "ملاحظات" بكل صف (حسب المصدر الرسمي)، وإلا نرجع لترتيب الأقسام كخيار أخير فقط
    for(let r=headerIdx+1;r<endRow;r++){
      const row=rows[r];
      if(!row||row.every(c=>c===undefined||c===null||c==="")) continue;
      const customer_number=String(row[idx.number]??"").trim();
      const customer_name=String(row[idx.name]??"").trim();
      if(!customer_number||!customer_name) continue; // صف فاصل بين الأقسام — تجاوز صامت
      if(customer_name==="0"){ warnings.push(`صف ${r+1}: اسم العميل "0" — صف قالب غير حقيقي، تم تجاوزه`); continue; }
      const rowCurrency = detectCurrencyFromText(row[idx.notes]) || CURRENCY_ORDER[i] || "YER";
      if(!sectionCurrency) sectionCurrency=rowCurrency;
      parsed.push({customer_number,normalized_customer_number:normalizeCustomerNumber(customer_number),customer_name,debit:Number(row[idx.debit])||0,credit:Number(row[idx.credit])||0,notes:row[idx.notes]?String(row[idx.notes]):null,currency:rowCurrency,source_row:r+1});
      counts[rowCurrency]=(counts[rowCurrency]||0)+1;
    }
    sections.push({currency:sectionCurrency||CURRENCY_ORDER[i]||"?", header_row:headerIdx+1, detected_from: sectionCurrency?"ملاحظات":"ترتيب الأقسام"});
  });
  return {ok:errors.length===0,errors,warnings,rows:parsed,counts,sections};
}

/* ---------------------------- استيراد بيانات العملاء والاستحقاق (متابعه العملاء.xlsm) ---------------------------- */
function fuzzyHeaderIndex(headerRow, ...patterns){
  const norm=s=>String(s??"").replace(/\s/g,"");
  for(let c=0;c<headerRow.length;c++){
    const h=norm(headerRow[c]);
    if(patterns.some(p=>h.includes(p))) return c;
  }
  return -1;
}
function findFollowupHeaderRow(rows){
  for(let r=0;r<Math.min(rows.length,30);r++){
    const row=(rows[r]||[]).map(x=>String(x??"").replace(/\s/g,""));
    if(row.some(h=>h.includes("رقمالعميل")) && row.some(h=>h.includes("تاريخالاستحقاق")) && row.some(h=>h.includes("مسؤولمتابعة"))) return r;
  }
  return -1;
}
function excelSerialToDateStr(v){
  if(v instanceof Date) return localDateStr(v);
  if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400*1000)); return localDateStr(d); }
  return null;
}
function parseFollowupWorkbook(wb){
  const errors=[],warnings=[];
  if(!wb.SheetNames.includes("متابعة العملاء")) errors.push('لم يتم العثور على ورقة "متابعة العملاء" بالملف');
  if(!wb.SheetNames.includes("بيانات العملاء")) errors.push('لم يتم العثور على ورقة "بيانات العملاء" بالملف');
  if(errors.length) return {ok:false,errors,warnings,rows:[]};

  // ورقة بيانات العملاء (رقم، اسم، جوال1، جوال2، ضامن، حالة)
  const infoRows=XLSX.utils.sheet_to_json(wb.Sheets["بيانات العملاء"],{header:1,raw:true});
  const infoHeader=(infoRows[0]||[]).map(h=>String(h??""));
  const iNum=fuzzyHeaderIndex(infoHeader,"رقمالعم"), iName=fuzzyHeaderIndex(infoHeader,"اسمالعميل"),
        iM1=fuzzyHeaderIndex(infoHeader,"جوال1","الجوال1"), iM2=fuzzyHeaderIndex(infoHeader,"جوال2","الجوال2"),
        iGuar=fuzzyHeaderIndex(infoHeader,"ضامن","ضمانة"), iStatus=fuzzyHeaderIndex(infoHeader,"الحالة");
  const infoByNumber={};
  for(let r=1;r<infoRows.length;r++){
    const row=infoRows[r]; if(!row) continue;
    const num=String(row[iNum]??"").trim(); if(!num) continue;
    infoByNumber[normalizeCustomerNumber(num)]={
      customer_number:num, customer_name:String(row[iName]??"").trim(),
      mobile_1: row[iM1]?String(row[iM1]).trim():"", mobile_2: row[iM2]?String(row[iM2]).trim():"",
      guarantor: row[iGuar]?String(row[iGuar]).trim():"", customer_status: row[iStatus]?String(row[iStatus]).trim():"",
    };
  }

  // ورقة متابعة العملاء (استحقاق، مهل، مسؤول، فئة) — الرأس الحقيقي ديناميكي (وُجد بالملف الرسمي بالصف 13)
  const fRows=XLSX.utils.sheet_to_json(wb.Sheets["متابعة العملاء"],{header:1,raw:true});
  const hIdx=findFollowupHeaderRow(fRows);
  if(hIdx<0){ errors.push('تعذّر التعرف على صف رؤوس أعمدة ورقة "متابعة العملاء"'); return {ok:false,errors,warnings,rows:[]}; }
  const header=(fRows[hIdx]||[]).map(h=>String(h??""));
  const cNum=fuzzyHeaderIndex(header,"رقمالعميل"), cDue=fuzzyHeaderIndex(header,"تاريخالاستحقاق"),
        cAssigned=fuzzyHeaderIndex(header,"مسؤولمتابعة"), cCategory=fuzzyHeaderIndex(header,"فئةالعملاء","فئةالعميل"),
        cName=fuzzyHeaderIndex(header,"اسمالزبون","اسمالعميل");
  // أعمدة المهلة الثلاث: تحمل عناوين رقمية 1،2،3 متتالية (تحت عنوان مدمج "مهلة إضافية بعد التواصل")
  const graceCols=[];
  for(let c=0;c<header.length-2;c++){
    if(String(fRows[hIdx][c]).trim()==="1" && String(fRows[hIdx][c+1]).trim()==="2" && String(fRows[hIdx][c+2]).trim()==="3"){ graceCols.push(c,c+1,c+2); break; }
  }
  const cNotes1=fuzzyHeaderIndex(header,"ملاحظ","ملاحض");
  const cNotes2=header.length-1;
  if(cNum<0||cDue<0){ errors.push('أعمدة أساسية مفقودة بورقة "متابعة العملاء" (رقم العميل / تاريخ الاستحقاق)'); return {ok:false,errors,warnings,rows:[]}; }

  const merged=[]; const seen=new Set();
  for(let r=hIdx+1;r<fRows.length;r++){
    const row=fRows[r]; if(!row) continue;
    const rawNum=row[cNum]; if(rawNum===undefined||rawNum===null||rawNum==="") continue;
    const num=String(rawNum).trim();
    const rowName=cName>=0?String(row[cName]??"").trim():"";
    if(rowName==="0"){ warnings.push(`صف ${r+1}: اسم العميل "0" — صف قالب غير حقيقي، تم تجاوزه`); continue; }
    const norm=normalizeCustomerNumber(num);
    if(seen.has(norm)){ warnings.push(`صف ${r+1}: رقم عميل مكرر (${num}) بورقة المتابعة — أُخذ أول ظهور فقط`); continue; }
    seen.add(norm);
    const info=infoByNumber[norm]||{};
    merged.push({
      customer_number: info.customer_number||num,
      customer_name: info.customer_name||rowName||"",
      mobile_1: info.mobile_1||"", mobile_2: info.mobile_2||"", guarantor: info.guarantor||"",
      customer_status: info.customer_status||"",
      due_date: excelSerialToDateStr(row[cDue]),
      grace_1: graceCols.length?(Number(row[graceCols[0]])||0):0,
      grace_2: graceCols.length?(Number(row[graceCols[1]])||0):0,
      grace_3: graceCols.length?(Number(row[graceCols[2]])||0):0,
      assigned_collector_name: cAssigned>=0?String(row[cAssigned]??"").trim():"",
      category_name: cCategory>=0?String(row[cCategory]??"").trim():"",
      notes: [cNotes1>=0?row[cNotes1]:null, row[cNotes2]].filter(Boolean).map(String).join(" / ")||null,
      source_row: r+1,
    });
  }
  return {ok:true,errors,warnings,rows:merged};
}


/* ============================================================================
   الحالة والتخزين
   ----------------------------------------------------------------------------
   قاعدة بيانات حقيقية متصلة (Supabase) — لا يوجد أي تخزين محلي وهمي بعد الآن.
   كل شاشة تُحمَّل بيانات فعلية من public.* عبر supabase-js، وكل حفظ يكتب
   مباشرة في القاعدة عبر RLS المرتبطة بدور/صلاحيات المستخدم الحقيقي.
   ============================================================================ */
let ST=null;
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
// تاريخ محلي صحيح (سنة-شهر-يوم حسب توقيت الجهاز الفعلي)، بدل toISOString() اللي تفرض UTC دائماً
// وتسبب خطأ يوم كامل بالمناطق ذات الفارق الموجب (مثل اليمن UTC+3) خلال أول ساعات كل يوم.
function localDateStr(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
const todayStr=()=>localDateStr(new Date());
const fmt=n=>(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

/* ============================================================================
   تحويل الصفوف القادمة من Supabase إلى نفس الشكل الذي تتوقعه شاشات العرض
   (أسماء حقول قديمة مألوفة بالكود ⇄ أسماء الأعمدة الفعلية بقاعدة البيانات)
   ============================================================================ */
function mapRole(r){ return {id:r.id, name_role:r.role_name}; }
function mapCustomer(c){ return {...c, status_customer:c.customer_status}; }
function mapFollowup(f){ return {...f, type_followup:f.followup_type, description_customer:f.customer_description, level_seriousness:f.seriousness_level}; }

async function loadState(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ ST=null; showLogin(); return; }
  try{
    await syncFromSupabase();
    showApp();
  }catch(e){
    console.error(e);
    showToast("تعذر تحميل بيانات النظام: "+e.message, true);
    showLogin();

}

// كل الشاشات بعد أي تعديل تعيد التحميل من القاعدة مباشرة بدل الاعتماد على نسخة محلية قد تُفقد
async function saveState(){ await syncFromSupabase(); }

function computeUsersFromRaw(usersRaw, dirRaw, permsRaw, rolePermsRaw, upoRaw, ufoRaw, uacRaw){
  const dirMap={}; (dirRaw||[]).forEach(d=>dirMap[d.id]=d.full_name);
  function hasPerm(u, key){
    const ov=(upoRaw||[]).find(o=>o.user_id===u.id && permsRaw.find(p=>p.id===o.permission_id)?.permission_key===key);
    if(ov) return ov.is_allowed;
    const rp=(rolePermsRaw||[]).find(rp=>rp.role_id===u.role_id && permsRaw.find(p=>p.id===rp.permission_id)?.permission_key===key);
    return rp ? rp.is_allowed : false;
  }
  const users=(usersRaw||[]).map(u=>{
    const allowed_screens=ALL_SCREENS.filter(s=>hasPerm(u,"screen."+s));
    const allowed_category_ids=(uacRaw||[]).filter(x=>x.user_id===u.id).map(x=>x.category_id);
    const screen_permissions={};
    Object.keys(ACTION_CATALOG).forEach(screen=>{
      screen_permissions[screen]=screen_permissions[screen]||{actions:{},hidden_fields:[]};
      ACTION_CATALOG[screen].forEach(a=>{ screen_permissions[screen].actions[a.key]=hasPerm(u,a.permKey); });
    });
    Object.keys(FIELD_CATALOG).forEach(screen=>{
      screen_permissions[screen]=screen_permissions[screen]||{actions:{},hidden_fields:[]};
      screen_permissions[screen].hidden_fields=(ufoRaw||[]).filter(x=>x.user_id===u.id && x.screen_key===screen && x.can_view===false).map(x=>x.field_key);
    });
    return {...u, full_name:dirMap[u.id]||u.full_name, allowed_screens, allowed_category_ids, screen_permissions};
  });
  return {users, dirMap};
}

// تحديث جزئي خفيف: يجلب فقط الجداول المتأثرة فعلياً بعد إجراء بسيط، بدل إعادة جلب كل شيء (22 استعلاماً) في كل مرة.
// هذا هو الإصلاح الأساسي لمشكلة بطء الاستخدام — saveState() الكاملة كانت تُستدعى بعد كل ضغطة زر.
async function refreshTables(keys){
  const tasks=[];
  if(keys.includes("customers")) tasks.push(sb.from("customers").select("*").then(({data})=>{ ST.customers=(data||[]).map(mapCustomer); }));
  if(keys.includes("balances")) tasks.push(sb.from("customer_balances").select("*").then(({data})=>{ ST.balances=data||[]; }));
  if(keys.includes("dueDates")) tasks.push(sb.from("customer_due_dates").select("*").then(({data})=>{ ST.dueDates=data||[]; }));
  if(keys.includes("followups")) tasks.push(sb.from("followups").select("*").then(({data})=>{ ST.followups=(data||[]).map(mapFollowup); }));
  if(keys.includes("notifications")) tasks.push(sb.from("notifications").select("*").then(({data})=>{ ST.notifications=data||[]; }));
  if(keys.includes("notifTypeViews")) tasks.push(sb.from("notification_type_views").select("*").then(({data})=>{ ST.notifTypeViews=data||[]; }));
  if(keys.includes("reminders")) tasks.push(sb.from("reminders").select("*").then(({data})=>{ ST.reminders=data||[]; }));
  if(keys.includes("collectorTags")) tasks.push(Promise.all([
    sb.from("collector_tag_labels").select("*"), sb.from("collector_customer_tags").select("*"),
  ]).then(([lbl,tags])=>{ ST.collectorTagLabels=lbl.data||[]; ST.collectorCustomerTags=tags.data||[]; }));
  if(keys.includes("categories")) tasks.push(sb.from("customer_categories").select("*").order("category_name").then(({data})=>{ ST.customerCategories=data||[]; }));
  if(keys.includes("excelImports")) tasks.push(sb.from("excel_imports").select("*").order("import_date",{ascending:false}).then(({data})=>{ ST.excelImports=data||[]; }));
  if(keys.includes("activityLogs")) tasks.push(sb.from("activity_logs").select("*").order("created_at",{ascending:false}).limit(200).then(({data})=>{ ST.activityLogs=data||[]; }));
  if(keys.includes("incentives")) tasks.push(Promise.all([
    sb.from("incentives").select("*"), sb.from("incentive_payments").select("*"),
  ]).then(([inc,pay])=>{ ST.incentives=inc.data||[]; ST.incentivePayments=pay.data||[]; }));
  if(keys.includes("settings")) tasks.push(Promise.all([
    sb.from("settings").select("*"), sb.from("exchange_rate_history").select("*").order("effective_from",{ascending:false}).order("created_at",{ascending:false}),
  ]).then(([s,ex])=>{
    const settings={}; (s.data||[]).forEach(row=>{
      let v=row.setting_value;
      if(row.data_type==="text") v=String(v).replace(/^"|"$/g,"");
      else if(row.data_type==="number") v=Number(v);
      else if(row.data_type==="boolean") v=(v===true||v==="true");
      settings[row.setting_key]=v;
    });
    const latestExchRate=(code)=>{ const r=(ex.data||[]).find(x=>x.currency_code===code); return r?Number(r.rate):null; };
    settings.exchange_rate_usd=latestExchRate("USD")??530; settings.exchange_rate_sar=latestExchRate("SAR")??141;
    ST.settings=settings;
  }));
  if(keys.includes("users")) tasks.push(Promise.all([
    sb.from("users").select("*"), sb.rpc("get_user_directory"), sb.from("permissions").select("*"),
    sb.from("role_permissions").select("*"), sb.from("user_permission_overrides").select("*"),
    sb.from("user_field_overrides").select("*"), sb.from("user_allowed_categories").select("*"),
  ]).then(([u,dir,perms,rp,upo,ufo,uac])=>{
    const {users,dirMap}=computeUsersFromRaw(u.data,dir.data,perms.data,rp.data,upo.data,ufo.data,uac.data);
    ST.users=users; ST.userDirectory=dirMap;
  }));
  await Promise.all(tasks);
}

async function syncFromSupabase(){
  const {data:{user:authUser}} = await sb.auth.getUser();
  if(!authUser) throw new Error("لا توجد جلسة دخول");

  const [
    {data:rolesRaw, error:e1}, {data:permsRaw, error:e2}, {data:rolePermsRaw, error:e3},
    {data:usersRaw, error:e4}, {data:dirRaw, error:e5},
    {data:catsRaw, error:e6}, {data:custRaw, error:e7}, {data:balRaw, error:e8},
    {data:dueRaw, error:e9}, {data:fuRaw, error:e10}, {data:notifRaw, error:e11}, {data:remindRaw, error:e20},
    {data:tagLabelsRaw, error:e21}, {data:custTagsRaw, error:e22},
    {data:importsRaw, error:e12}, {data:logsRaw, error:e13},
    {data:upoRaw, error:e14}, {data:ufoRaw, error:e15}, {data:uacRaw, error:e16},
    {data:incRaw, error:e17}, {data:incPayRaw, error:e18}, {data:settingsRaw, error:e19}, {data:exchRaw, error:e23},
    {data:ntvRaw, error:e24},
  ] = await Promise.all([
    sb.from("roles").select("*"),
    sb.from("permissions").select("*"),
    sb.from("role_permissions").select("*"),
    sb.from("users").select("*"),
    sb.rpc("get_user_directory"),
    sb.from("customer_categories").select("*").order("category_name"),
    sb.from("customers").select("*"),
    sb.from("customer_balances").select("*"),
    sb.from("customer_due_dates").select("*"),
    sb.from("followups").select("*"),
    sb.from("notifications").select("*"),
    sb.from("reminders").select("*"),
    sb.from("collector_tag_labels").select("*"),
    sb.from("collector_customer_tags").select("*"),
    sb.from("excel_imports").select("*").order("import_date",{ascending:false}),
    sb.from("activity_logs").select("*").order("created_at",{ascending:false}).limit(200),
    sb.from("user_permission_overrides").select("*"),
    sb.from("user_field_overrides").select("*"),
    sb.from("user_allowed_categories").select("*"),
    sb.from("incentives").select("*"),
    sb.from("incentive_payments").select("*"),
    sb.from("settings").select("*"),
    sb.from("exchange_rate_history").select("*").order("effective_from",{ascending:false}).order("created_at",{ascending:false}),
    sb.from("notification_type_views").select("*"),
  ]);
  const firstErr=[e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24].find(Boolean);
  if(firstErr) throw firstErr;

  const {users, dirMap}=computeUsersFromRaw(usersRaw, dirRaw, permsRaw, rolePermsRaw, upoRaw, ufoRaw, uacRaw);
  const roles=(rolesRaw||[]).map(mapRole);

  const settings={};
  (settingsRaw||[]).forEach(s=>{
    let v=s.setting_value;
    if(s.data_type==="text") v=String(v).replace(/^"|"$/g,"");
    else if(s.data_type==="number") v=Number(v);
    else if(s.data_type==="boolean") v=(v===true||v==="true");
    settings[s.setting_key]=v;
  });
  // BUG حقيقي كان هنا: القيم كانت ثابتة بالكود (530/141) ولا تتحدث أبداً حتى لو غيّر المدير السعر من شاشة الإعدادات.
  // الآن تُقرأ فعلياً آخر قيمة من exchange_rate_history (تُحدَّث تلقائياً بمجرد أي تعديل سعر من الإعدادات).
  const latestExchRate=(code)=>{ const r=(exchRaw||[]).find(x=>x.currency_code===code); return r ? Number(r.rate) : null; };
  settings.exchange_rate_usd = latestExchRate("USD") ?? 530;
  settings.exchange_rate_sar = latestExchRate("SAR") ?? 141;

  ST = {
    roles, users,
    customerCategories:(catsRaw||[]),

    balances:(balRaw||[]),
    dueDates:(dueRaw||[]),

    settings,
    currentUserId:authUser.id,
    isLoggedIn:true,
    view: (ST && ST.view) || {name:"dashboard"},
  };
}

/* ---------------------------- تسجيل الدخول (تجريبي — غير آمن، راجع التنبيه بالشاشة) ---------------------------- */
function showLogin(){
  $("#shell").style.display="none";
  $("#loginScreen").style.display="flex";
  $("#loginError").classList.remove("show");
  $("#loginUsername").value=""; $("#loginPassword").value="";
  const btn=$("#loginBtn");
  if(btn.dataset.built!=="1"){
    btn.dataset.built="1";
    btn.addEventListener("click", attemptLogin);
    $("#loginPassword").addEventListener("keydown", e=>{ if(e.key==="Enter") attemptLogin(); });
    $("#loginUsername").addEventListener("keydown", e=>{ if(e.key==="Enter") attemptLogin(); });
  }
  $("#loginUsername").focus();
}
function showApp(){
  $("#loginScreen").style.display="none";
  $("#shell").style.display="flex";
  $("#menuToggle").addEventListener("click",openMobileMenu);
  $("#sidebarBackdrop").addEventListener("click",closeMobileMenu);
  render();
}
async function attemptLogin(){
  const email=$("#loginUsername").value.trim();
  const password=$("#loginPassword").value;
  const errEl=$("#loginError");
  errEl.classList.remove("show");
  const btn=$("#loginBtn"); btn.disabled=true; btn.textContent="جاري الدخول...";
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  btn.disabled=false; btn.textContent="تسجيل الدخول";
  if(error){
    errEl.textContent = error.message==="Invalid login credentials" ? "البريد الإلكتروني أو كلمة المرور غير صحيحة" : error.message;
    errEl.classList.add("show");
    return;
  }
  try{
    await syncFromSupabase();
    const me=currentUser();
    if(!me){ errEl.textContent="هذا الحساب غير مرتبط بمستخدم بالنظام — راجع مدير النظام"; errEl.classList.add("show"); await sb.auth.signOut(); return; }
    if(me.status!=="نشط"){ errEl.textContent="هذا المستخدم موقوف — راجع مدير النظام"; errEl.classList.add("show"); await sb.auth.signOut(); return; }
    await insertActivityLog("login","users",me.id);
    ST.view={name:"dashboard"};
    showApp();
  }catch(e){
    errEl.textContent="تعذر تحميل بيانات النظام: "+e.message;
    errEl.classList.add("show");
  }
}
async function logout(){
  if(ST) await insertActivityLog("logout","users",ST.currentUserId);
  await sb.auth.signOut();
  ST=null;
  showLogin();
}
function showToast(msg,isErr){
  const t=$("#toast"); t.textContent=msg; t.className="toast show"+(isErr?" err":"");
  setTimeout(()=>t.classList.remove("show"),2400);
}
async function insertActivityLog(action_type,table_name,record_id,old_value,new_value){
  try{
    await sb.from("activity_logs").insert({user_id:ST?ST.currentUserId:null,action_type,table_name,record_id:String(record_id),old_value:old_value||null,new_value:new_value||null});
  }catch(e){ console.error("activity_log insert failed",e); }

/* ============================================================================
   الصلاحيات
   الأدوار الأربعة تحدد الإطار العام (حسب المواصفات)، وفوقها كل مستخدم له:
   - allowed_screens: الشاشات المسموح له بفتحها
   - allowed_category_ids: فئات العملاء المسموح له برؤيتها (فارغة = كل الفئات)
   هذا التقييد الإضافي هو ما طلبه صاحب المشروع فوق الأدوار الثابتة.
   ============================================================================ */
const ALL_SCREENS=["dashboard","followups","customers","notifications","import","performance","users","reports","settings"];

function currentUser(){ return ST.users.find(u=>u.id===ST.currentUserId); }
function roleName(u){ const r=ST.roles.find(r=>r.id===(u||currentUser()).role_id); return r?r.name_role:""; }
function isAdmin(){ return roleName()==="مدير النظام"; }
function isAccountant(){ return roleName()==="المحاسب"; }
function isCollector(){ return roleName()==="مسؤول التحصيل"; }

function allowedScreens(u){
  u = u || currentUser();
  return Array.isArray(u.allowed_screens) ? u.allowed_screens : ALL_SCREENS;
}
function hasScreenAccess(screenKey, u){
  return allowedScreens(u).includes(screenKey);
}
function allowedCategoryIds(u){
  u = u || currentUser();
  return Array.isArray(u.allowed_category_ids) ? u.allowed_category_ids : [];
}

function visibleCustomers(){
  let list;
  if(isCollector()){
    list = ST.customers.filter(c=>c.assigned_user_id===ST.currentUserId);
  }else{
    list = ST.customers; // مدير/محاسب/مخصص: كل العملاء، ثم يُطبَّق قيد الفئة أدناه إن وُجد
  }
  const cats = allowedCategoryIds();
  if(cats.length){
    list = list.filter(c => c.customer_category_id && cats.includes(c.customer_category_id));
  }
  return list;
}
function canSeeCustomer(customerId){
  return visibleCustomers().some(c=>c.id===customerId);
}
function canImport(){ return isAdmin()||isAccountant(); }

// صلاحية الإجراء الافتراضية حسب الدور فقط (تُستخدم إذا ما في تخصيص صريح لهذا المستخدم)
function roleDefaultAction(roleNm, screen, action){
  if(roleNm==="مدير النظام") return true;
  if(screen==="customers"){
    if(action==="create"||action==="edit") return roleNm==="المحاسب";
    if(action==="deactivate") return false;
  }
  if(screen==="followups" && action==="create") return true; // أي مستخدم يشوف العميل يقدر يضيف متابعة افتراضياً
  if(screen==="users") return false;
  if(screen==="performance" && action==="create") return false;
  if(screen==="settings"){
    return (roleNm==="المحاسب") && (action==="backup_view" || action==="backup_use" || action==="factory_reset");
  }
  return false;
}

function screenAction(screen, action, u){
  u = u || currentUser();
  const sp = u.screen_permissions && u.screen_permissions[screen];
  if(sp && Object.prototype.hasOwnProperty.call(sp,"actions") && Object.prototype.hasOwnProperty.call(sp.actions,action)){
    return !!sp.actions[action];
  }
  return roleDefaultAction(roleName(u), screen, action);
}
function isFieldHidden(screen, field, u){
  u = u || currentUser();
  const sp = u.screen_permissions && u.screen_permissions[screen];
  return !!(sp && Array.isArray(sp.hidden_fields) && sp.hidden_fields.includes(field));
}
function visibleFields(screen, u){
  return (FIELD_CATALOG[screen]||[]).filter(f=>!isFieldHidden(screen,f.key,u));
}

   ============================================================================ */
function customerBalances(customerId){
  const rows=ST.balances.filter(b=>b.customer_id===customerId);
  // الرصيد الحالي = آخر لقطة استيراد لكل عملة فقط (وليس مجموع كل اللقطات التاريخية)
  const latestByCurrency={};
  rows.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(b=>{ latestByCurrency[b.currency]=b; });
  const val=(cur)=>latestByCurrency[cur]?(latestByCurrency[cur].debit-latestByCurrency[cur].credit):0;
  return {usd:val("USD"),sar:val("SAR"),yer:val("YER")};
}
function customerTotalYER(customerId){
  const b=customerBalances(customerId);
  return calcTotalDueYER(b.usd,b.sar,b.yer,ST.settings.exchange_rate_usd,ST.settings.exchange_rate_sar);
}
function customerDue(customerId){ return ST.dueDates.find(d=>d.customer_id===customerId); }
function customerDueComputed(customerId){
  const d=customerDue(customerId);
  if(!d) return null;
  const new_due_date=d.new_due_date; // القيمة الصحيحة محسوبة أصلاً بقاعدة البيانات (عمود مُشتق)، لا تُعاد حسابها بالواجهة
  const remaining_days=calcRemainingDays(new_due_date,todayStr());
  return {...d,new_due_date,remaining_days};
}
function userName(id){ if(!id) return "—"; return (ST.userDirectory&&ST.userDirectory[id]) || ST.users.find(u=>u.id===id)?.full_name || "—"; }
function categoryOf(customerId){ const c=ST.customers.find(c=>c.id===customerId); return ST.customerCategories.find(cc=>cc.id===c?.customer_category_id); }

const VIEW_TITLES={dashboard:"لوحة المدير",followups:"متابعة العملاء",customers:"العملاء",notifications:"مركز التنبيهات",import:"استيراد ملف Excel",performance:"الأداء والحوافز",users:"المستخدمون والصلاحيات",reports:"التقارير",settings:"الإعدادات",detail:"تفاصيل العميل"};

function navigate(name,params,fromBack){
  if(name!=="detail" && !hasScreenAccess(name)){
    showToast("لا تملك صلاحية الوصول لهذه الشاشة",true);
    name = hasScreenAccess("dashboard") ? "dashboard" : (allowedScreens()[0] || "dashboard");
  }
  if(!fromBack && ST.view && ST.view.name){
    if(!ST.historyStack) ST.historyStack=[];
    // لا تسجّل نفس الشاشة مرتين متتاليتين (مثلاً إعادة رسم بنفس المكان)
    if(!(ST.view.name===name && JSON.stringify(ST.view.params||{})===JSON.stringify(params||{}))){
      ST.historyStack.push({name:ST.view.name, params:ST.view.params||{}});
    }
  }
  ST.view={name,params:params||{}};
  closeMobileMenu();
  render();
}
function goBack(){
  if(!ST.historyStack || !ST.historyStack.length) return;
  const prev=ST.historyStack.pop();
  navigate(prev.name, prev.params, true);
}
function openMobileMenu(){ $("#sidebar").classList.add("open"); $("#sidebarBackdrop").classList.add("show"); }
function closeMobileMenu(){ $("#sidebar")?.classList.remove("open"); $("#sidebarBackdrop")?.classList.remove("show"); }

function render(){
  if(ST.view.name!=="detail" && !hasScreenAccess(ST.view.name)){
    ST.view={name: hasScreenAccess("dashboard")?"dashboard":(allowedScreens()[0]||"dashboard"), params:{}};
  }
  renderSidebar();
  renderTopbar();
  const c=$("#content");
  c.innerHTML="";
  if(ST.view.name==="detail" && !canSeeCustomer(ST.view.params.id)){
    c.innerHTML=`<div class="empty-state">لا تملك صلاحية مشاهدة هذا العميل (خارج نطاق الفئات أو العملاء المسموح بها لك)</div>`;
    return;
  }
  switch(ST.view.name){
    case "dashboard": renderDashboard(c); break;
    case "followups": renderFollowupsList(c); break;
    case "customers": renderCustomers(c); break;
    case "detail": renderCustomerDetail(c, ST.view.params.id); break;
    case "notifications": renderNotifications(c); break;
    case "import": renderImport(c); break;
    case "performance": renderPerformance(c); break;
    case "users": renderUsers(c); break;
    case "reports": renderReports(c); break;
    case "settings": renderSettings(c); break;
    default: c.innerHTML="<div class='empty-state'>الشاشة غير موجودة</div>";
  }
}

function unreadNotifCount(){
  const mine = isAdmin()||isAccountant() ? ST.notifications : ST.notifications.filter(n=>n.user_id===ST.currentUserId);
  return mine.filter(n=>n.status==="جديد").length;
}

async function handlePhotoUpload(e){
  const file=e.target.files[0]; if(!file) return;
  if(!file.type.startsWith("image/")){ showToast("الملف يجب أن يكون صورة",true); return; }
  if(file.size > 5*1024*1024){ showToast("حجم الصورة كبير جداً (الحد 5MB)",true); return; }
  const reader=new FileReader();
  reader.onload=async(ev)=>{
    const img=new Image();
    img.onload=async()=>{
      const size=256;
      const canvas=document.createElement("canvas");
      canvas.width=size; canvas.height=size;
      const ctx=canvas.getContext("2d");
      const side=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,size,size);
      const dataUri=canvas.toDataURL("image/jpeg",0.82);
      const {error}=await sb.rpc("update_my_photo",{p_photo:dataUri});
      if(error){ showToast("تعذر حفظ الصورة: "+error.message,true); return; }
      await refreshTables(["users"]); showToast("تم تحديث صورتك الشخصية"); render();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function renderSidebar(){
  const u=currentUser();
  if(u){
    const initials=(u.full_name||"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("");
    const avatarInner = u.photo_url ? `<img src="${u.photo_url}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : esc(initials);
    $("#sidebarProfile").innerHTML=`
      <div class="avatar">${avatarInner}<span class="dot"></span></div>
      <div class="name">${esc(u.full_name)}</div>
      <div class="role">${esc(roleName(u))}</div>
      <div style="margin-top:6px;"><label class="btn btn-outline btn-sm" style="cursor:pointer; font-size:10.5px; padding:3px 8px;">تغيير الصورة<input type="file" id="myPhotoInput" accept="image/*" style="display:none;"></label></div>`;
    const photoInput=$("#myPhotoInput");
    if(photoInput) photoInput.addEventListener("change",handlePhotoUpload);
  }

  const unread=unreadNotifCount();
  $("#navList").innerHTML=NAV_ITEMS.map(item=>{
    if(!hasScreenAccess(item.key)) return "";
    const active = ST.view.name===item.key || (ST.view.name==="detail" && item.key==="customers");
    const badge = (item.key==="notifications" && unread>0) ? `<span class="item-badge">${unread>99?"99+":unread}</span>` : "";
    return `<div class="nav-item ${active?"active":""}" data-view="${item.key}">${ICONS[item.key]}<span>${esc(item.label)}</span>${badge}</div>`;
  }).join("");
  $$("#navList .nav-item").forEach(el=>el.addEventListener("click",()=>navigate(el.dataset.view)));

  const lo=$("#sidebarLogout");
  lo.innerHTML=`${ICONS.logout}<span>تسجيل الخروج</span>`;
  if(lo.dataset.built!=="1"){ lo.dataset.built="1"; lo.addEventListener("click", logout); }
}
function renderTopbar(){
  $("#pageTitle").textContent = VIEW_TITLES[ST.view.name] || "";
  $("#pageCrumb").textContent = "الرئيسية / " + (VIEW_TITLES[ST.view.name] || "");
  $("#roleBadge").textContent = roleName();
  const backBtn=$("#backBtn");
  const hasHistory = ST.historyStack && ST.historyStack.length>0;
  backBtn.style.display = hasHistory ? "inline-flex" : "none";
  if(backBtn.dataset.bound!=="1"){ backBtn.dataset.bound="1"; backBtn.addEventListener("click",goBack); }
}

/* ---------------------------- لوحة المدير ---------------------------- */
function renderDashboard(c){
  const visible=visibleCustomers();
  const totalOutstanding=visible.reduce((s,cu)=>s+customerTotalYER(cu.id),0);
  const todayNotifs=ST.notifications.filter(n=>n.status==="جديد" && (isAdmin()||isAccountant()||n.user_id===ST.currentUserId));
  const overdue=visible.filter(cu=>{ const d=customerDueComputed(cu.id); return d && d.remaining_days<0; });
  const noFollowup=visible.filter(cu=>{
    const fs=ST.followups.filter(f=>f.customer_id===cu.id);
    return !fs.some(f=>daysBetween(f.followup_date,todayStr())<=ST.settings.no_followup_days_limit);
  });
  const weekAgo=addDays(todayStr(),-7);
  const handledThisWeek=ST.notifications.filter(n=>n.status==="تم التعامل" && n.handled_at && n.handled_at.slice(0,10)>=weekAgo && (isAdmin()||isAccountant()||n.user_id===ST.currentUserId));

  c.innerHTML=`
  <div class="stat-grid">
    <div class="stat-card" id="totalOutstandingCard" style="cursor:pointer;">
      <div class="icon-badge" style="background:var(--blue-50); color:var(--blue-700); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><span style="width:16px; height:16px; display:block;">${ICONS.performance}</span></div>
      <div class="lbl">إجمالي المستحق (بالريال)</div><div class="val">${fmt(totalOutstanding)}</div><div class="sub">${visible.length} عميل — اضغط للتفاصيل</div></div>
    <div class="stat-card" id="overdueCard" style="cursor:pointer;">
      <div class="icon-badge" style="background:var(--t-today-bg); color:var(--t-today-fg); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><span style="width:16px; height:16px; display:block;">${ICONS.calendarAlert}</span></div>
      <div class="lbl">عملاء متأخرون</div><div class="val danger">${overdue.length}</div><div class="sub">تجاوزوا تاريخ الاستحقاق — اضغط للتفاصيل</div></div>
    <div class="stat-card" id="todayNotifCard" style="cursor:pointer;">
      <div class="icon-badge" style="background:var(--t-promise-bg); color:var(--t-promise-fg); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><span style="width:16px; height:16px; display:block;">${ICONS.notifications}</span></div>
      <div class="lbl">تنبيهات اليوم</div><div class="val">${todayNotifs.length}</div><div class="sub">اضغط لفتح شاشة التنبيهات</div></div>
    <div class="stat-card" id="noFollowupCard" style="cursor:pointer;">
      <div class="icon-badge" style="background:var(--t-stale-bg); color:var(--t-stale-fg); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><span style="width:16px; height:16px; display:block;">${ICONS.clock}</span></div>
      <div class="lbl">بدون متابعة حديثة</div><div class="val">${noFollowup.length}</div><div class="sub">تجاوزوا ${ST.settings.no_followup_days_limit} يوم — اضغط للتفاصيل</div></div>
    <div class="stat-card" id="handledWeekCard" style="cursor:pointer;">
      <div class="icon-badge" style="background:var(--green-50,#ECFDF5); color:var(--green-700,#047857); width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; margin-bottom:10px;"><span style="width:16px; height:16px; display:block;">${ICONS.userCheck}</span></div>
      <div class="lbl">عملاء تم التعامل معهم خلال الأسبوع</div><div class="val">${handledThisWeek.length}</div><div class="sub">اضغط للتفاصيل الكاملة</div></div>
  </div>

  <div class="section-title">أعلى العملاء مديونية</div>
  <div class="table-wrap"><table><thead><tr><th>العميل</th><th>الفئة</th><th>المسؤول</th><th>المستحق بالريال</th><th></th></tr></thead>
  <tbody>${visible.slice().sort((a,b)=>customerTotalYER(b.id)-customerTotalYER(a.id)).slice(0,6).map(cu=>{
    const cat=categoryOf(cu.id);
    return `<tr class="row-click" data-open="${cu.id}">
      <td>${esc(cu.customer_name)}</td>
      <td>${cat?`<span class="cat-dot" style="background:${cat.color}"></span>${esc(cat.category_name)}`:"—"}</td>
      <td>${esc(userName(cu.assigned_user_id))}</td>
      <td class="mono">${fmt(customerTotalYER(cu.id))}</td>
      <td style="color:var(--blue-600); font-weight:600;">تفاصيل ←</td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" class="empty-state">لا يوجد عملاء بعد</td></tr>`}</tbody></table></div>

  ${(isAdmin()||isAccountant())?`
  <div class="section-title">آخر العمليات (سجل مصغّر)</div>
  ${activityLogTableHTML(8)}
  `:""}
  `;
  $$("[data-open]").forEach(el=>el.addEventListener("click",()=>navigate("detail",{id:el.dataset.open})));
  $("#handledWeekCard").addEventListener("click",()=>openCustomerListModal("عملاء تم التعامل معهم خلال الأسبوع",
    handledThisWeek.slice().sort((a,b)=>new Date(b.handled_at)-new Date(a.handled_at)).map(n=>{
      const cu=ST.customers.find(x=>x.id===n.customer_id);
      return {id:n.customer_id, name:cu?cu.customer_name:"—", line1:notifPillHTML(n.notification_type), line2:`${userName(n.user_id)} — ${(n.handled_at||"").replace("T"," ").slice(0,16)}`};
    })));
  $("#overdueCard").addEventListener("click",()=>openCustomerListModal("عملاء متأخرون",
    overdue.slice().sort((a,b)=>customerDueComputed(b.id).remaining_days-customerDueComputed(a.id).remaining_days).map(cu=>{
      const d=customerDueComputed(cu.id);
      return {id:cu.id, name:cu.customer_name, line1:`تأخر ${Math.abs(d.remaining_days)} يوم — استحقاقه ${d.new_due_date}`, line2:`المستحق: ${fmt(customerTotalYER(cu.id))} ريال`};
    })));
  $("#noFollowupCard").addEventListener("click",()=>openCustomerListModal("عملاء بدون متابعة حديثة",
    noFollowup.map(cu=>({id:cu.id, name:cu.customer_name, line1:`المسؤول: ${userName(cu.assigned_user_id)}`, line2:`المستحق: ${fmt(customerTotalYER(cu.id))} ريال`}))));
  $("#totalOutstandingCard").addEventListener("click",()=>navigate("customers"));
  $("#todayNotifCard").addEventListener("click",()=>navigate("notifications"));
}

function openCustomerListModal(title, list){
  const modal=$("#modalCategory");
  modal.classList.add("wide");
  modal.innerHTML=`
  <div class="modal-header"><h2>${esc(title)} (${list.length})</h2><span class="x" data-close="overlayCategory">✕</span></div>
  <div class="modal-body">
    <div class="table-wrap"><table><thead><tr><th>العميل</th><th></th><th></th></tr></thead><tbody>
    ${list.map(item=>`<tr>
      <td class="row-click" data-open2="${item.id}" style="font-weight:600;">${esc(item.name)}</td>
      <td style="font-size:12.5px;">${item.line1||""}</td>
      <td class="mono" style="font-size:12px; color:var(--gray-500);">${item.line2||""}</td>
    </tr>`).join("") || `<tr><td colspan="3" class="empty-state">لا يوجد</td></tr>`}
    </tbody></table></div>
  </div>
  <div class="modal-footer"><button class="btn btn-outline" data-close="overlayCategory">إغلاق</button></div>`;
  $("#overlayCategory").classList.add("show");
  $$('[data-close="overlayCategory"]').forEach(el=>el.addEventListener("click",()=>{ $("#overlayCategory").classList.remove("show"); modal.classList.remove("wide"); }));
  $$("[data-open2]").forEach(el=>el.addEventListener("click",()=>{ $("#overlayCategory").classList.remove("show"); navigate("detail",{id:el.dataset.open2}); }));
}

/* ---------------------------- متابعة العملاء ---------------------------- */
function lastFollowupOf(customerId){
  const fs=ST.followups.filter(f=>f.customer_id===customerId).sort((a,b)=>new Date(b.followup_date)-new Date(a.followup_date));
  return fs[0]||null;
}

function renderFollowupsList(c){
  const q=(ST.view.params?.q||"").toLowerCase();
  const catFilter=ST.view.params?.cat||"";
  const tagFilter=ST.view.params?.ftag||"d";
  let list=visibleCustomers().filter(cu=>cu.is_active);
  if(q) list=list.filter(cu=>cu.customer_name.toLowerCase().includes(q)||cu.customer_number.includes(q));
  if(catFilter) list=list.filter(cu=>cu.customer_category_id===catFilter);
  const listBeforeTag=list;
  if(tagFilter!=="d") list=list.filter(cu=>myTagOf(cu.id)===tagFilter);
  const tagCounts={a:0,b:0,c:0,d:listBeforeTag.length};
  listBeforeTag.forEach(cu=>{ const t=myTagOf(cu.id); if(t!=="d") tagCounts[t]++; });
  list=list.slice().sort((a,b)=>{
    const da=customerDueComputed(a.id), db=customerDueComputed(b.id);
    return (da?da.remaining_days:999)-(db?db.remaining_days:999);
  });

  const fields=visibleFields("followups");
  const canAddFollowup=screenAction("followups","create");
  const cellRenderers={
    due_date: cu=>{ const d=customerDueComputed(cu.id); return `<td class="mono">${d?d.new_due_date:"—"}</td>`; },
    customer_name: cu=>`<td class="row-click" data-open="${cu.id}" style="font-weight:600;">${esc(cu.customer_name)}</td>`,
    mobile_1: cu=>`<td class="mono">${cu.mobile_1?`<a href="tel:${esc(cu.mobile_1)}" style="color:var(--blue-600); text-decoration:none;">${esc(cu.mobile_1)}</a>`:"—"}</td>`,
    remaining: cu=>`<td class="mono">${fmt(customerTotalYER(cu.id))}</td>`,
    status_pill: cu=>{
      const d=customerDueComputed(cu.id);
      let pill='<span class="pill pill-gray">—</span>';
      if(d){
        const r=d.remaining_days;
        // القواعد الدقيقة المستخرجة فعلياً من Conditional Formatting بملف Excel (docs/EXCEL_BUSINESS_RULES.md)
        if(r===0 || (r<=-2 && r>=-99)) pill='<span class="pill pill-red">متأخر/مستحق اليوم</span>';
        else if([2,3].includes(r) || cu.customer_status==="يسوق الآن" || cu.customer_status==="يسوق الان") pill='<span class="pill" style="background:#E0FBFF; color:#0891B2;">يسوق الآن</span>';
        else if([1,4,5].includes(r)) pill='<span class="pill pill-amber">قريب الاستحقاق</span>';
        else pill='<span class="pill pill-green">ضمن المهلة</span>';
      }
      return `<td>${pill}</td>`;
    },
    assigned_user: cu=>`<td>${esc(userName(cu.assigned_user_id))}</td>`,
    next_appointment: cu=>{ const f=lastFollowupOf(cu.id); return `<td class="mono">${f&&f.next_followup_date?f.next_followup_date:"—"}</td>`; },
    last_followup_details: cu=>{ const f=lastFollowupOf(cu.id); return `<td style="max-width:220px; font-size:12px; color:var(--gray-600);">${f&&f.details?esc(f.details):"—"}</td>`; },
  };

  c.innerHTML=`
  <div class="toolbar" style="gap:8px; flex-wrap:wrap;">
    ${["d","a","b","c"].map(k=>`<button class="btn ${tagFilter===k?'btn-primary':'btn-outline'} btn-sm" data-ftagfilter="${k}" style="${tagFilter===k?'':`border-color:${myTagColor(k)}; color:${myTagColor(k)};`}"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${myTagColor(k)}; margin-inline-end:5px;"></span>${esc(myTagLabel(k))} <span style="opacity:.7;">(${tagCounts[k]})</span></button>`).join("")}
  </div>
  <div class="toolbar">
    <input type="text" id="fSearch" placeholder="ابحث بالاسم أو رقم العميل..." value="${esc(q)}">
    <select id="fCatFilter">
      <option value="">كل الفئات</option>
      ${ST.customerCategories.map(cc=>`<option value="${cc.id}" ${catFilter===cc.id?"selected":""}>${esc(cc.category_name)}</option>`).join("")}
    </select>
  </div>
  <div class="table-wrap"><table><thead><tr>
    <th>تصنيفي</th>${fields.map(f=>`<th>${esc(f.label)}</th>`).join("")}<th></th>
  </tr></thead><tbody>
  ${list.map(cu=>{
    const myTag=myTagOf(cu.id);
    return `<tr><td>
      <select class="tagSelect" data-tagcustomer="${cu.id}" style="font-size:11.5px; padding:3px 6px; border:2px solid ${myTagColor(myTag)}; border-radius:5px;">
        ${["d","a","b","c"].map(k=>`<option value="${k}" ${myTag===k?"selected":""}>${esc(myTagLabel(k))}</option>`).join("")}
      </select>
    </td>${fields.map(f=>cellRenderers[f.key](cu)).join("")}
      <td style="display:flex; gap:6px; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" data-open="${cu.id}">تفاصيل</button>
        <button class="btn btn-outline btn-sm" data-remind="${cu.id}">${ICONS.clock}ذكرني</button>
        ${canAddFollowup?`<button class="btn btn-primary btn-sm" data-addfollow="${cu.id}">إضافة متابعة</button>`:""}
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="${fields.length+2}" class="empty-state">لا يوجد عملاء ضمن نطاق صلاحيتك</td></tr>`}
  </tbody></table></div>`;

  $$("[data-ftagfilter]").forEach(el=>el.addEventListener("click",()=>{ ST.view.params={...ST.view.params,ftag:el.dataset.ftagfilter}; renderFollowupsList($("#content")); }));
  $("#fSearch").addEventListener("input",e=>{ ST.view.params={...ST.view.params,q:e.target.value}; renderFollowupsList($("#content")); });
  $("#fCatFilter").addEventListener("change",e=>{ ST.view.params={...ST.view.params,cat:e.target.value}; renderFollowupsList($("#content")); });
  $$("[data-open]").forEach(el=>el.addEventListener("click",()=>navigate("detail",{id:el.dataset.open})));
  $$("[data-remind]").forEach(el=>el.addEventListener("click",()=>openReminderModal(el.dataset.remind)));
  $$("[data-addfollow]").forEach(el=>el.addEventListener("click",()=>openFollowupModal(el.dataset.addfollow)));
  $$(".tagSelect").forEach(el=>el.addEventListener("change",async()=>{
    const customerId=el.dataset.tagcustomer, tagKey=el.value;
    const {error}=await sb.from("collector_customer_tags").upsert({user_id:ST.currentUserId, customer_id:customerId, tag_key:tagKey},{onConflict:"user_id,customer_id"});
    if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
    await refreshTables(["collectorTags"]); renderFollowupsList($("#content"));
  }));
}

/* ---------------------------- العملاء ---------------------------- */
const CUSTOMER_CELL_RENDERERS={
  customer_number: cu=>`<td class="mono">${esc(cu.customer_number)}</td>`,
  customer_name: cu=>`<td class="row-click" data-open="${cu.id}" style="font-weight:600;">${esc(cu.customer_name)}</td>`,
  mobile_1: cu=>`<td class="mono">${esc(cu.mobile_1||"—")}</td>`,
  mobile_2: cu=>`<td class="mono">${esc(cu.mobile_2||"—")}</td>`,
  guarantor: cu=>`<td>${esc(cu.guarantor||"—")}</td>`,
  category: cu=>{ const cat=categoryOf(cu.id); return `<td>${cat?`<span class="cat-dot" style="background:${cat.color}"></span>${esc(cat.category_name)}`:"—"}</td>`; },
  status_customer: cu=>`<td>${cu.is_active?'<span class="pill pill-green">نشط</span>':'<span class="pill pill-gray">موقوف</span>'}</td>`,
  assigned_user: cu=>`<td>${esc(userName(cu.assigned_user_id))}</td>`,
  total_due: cu=>`<td class="mono">${fmt(customerTotalYER(cu.id))}</td>`,
};

function renderCustomers(c){
  const q=(ST.view.params?.q||"").toLowerCase();
  const catFilter=ST.view.params?.cat||"";
  const tagFilter=ST.view.params?.tag||"d"; // د = الافتراضي، يظهر تلقائياً لكل متحصل يحوي كل عملائه
  let list=visibleCustomers();
  if(q) list=list.filter(cu=>cu.customer_name.toLowerCase().includes(q)||cu.customer_number.includes(q));
  if(catFilter) list=list.filter(cu=>cu.customer_category_id===catFilter);
  const listBeforeTag=list;
  if(tagFilter!=="d") list=list.filter(cu=>myTagOf(cu.id)===tagFilter);

  const fields=visibleFields("customers");
  const canCreate=screenAction("customers","create");
  const canDeactivate=screenAction("customers","deactivate");

  const tagCounts={a:0,b:0,c:0,d:listBeforeTag.length};
  listBeforeTag.forEach(cu=>{ const t=myTagOf(cu.id); if(t!=="d") tagCounts[t]++; });

  c.innerHTML=`
  <div class="toolbar" style="gap:8px; flex-wrap:wrap;">
    ${["d","a","b","c"].map(k=>`<button class="btn ${tagFilter===k?'btn-primary':'btn-outline'} btn-sm" data-tagfilter="${k}" style="${tagFilter===k?'':`border-color:${myTagColor(k)}; color:${myTagColor(k)};`}"><span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:${myTagColor(k)}; margin-inline-end:5px;"></span>${esc(myTagLabel(k))} <span style="opacity:.7;">(${tagCounts[k]})</span></button>`).join("")}
    <button class="btn btn-outline btn-sm" id="renameTagsBtn">${ICONS.settings}تسمية تصنيفاتي</button>
  </div>
  <div class="toolbar">
    <input type="text" id="cSearch" placeholder="ابحث بالاسم أو رقم العميل..." value="${esc(q)}">
    <select id="cCatFilter">
      <option value="">كل الفئات</option>
      ${ST.customerCategories.map(cc=>`<option value="${cc.id}" ${catFilter===cc.id?"selected":""}>${esc(cc.category_name)}</option>`).join("")}
    </select>
    ${canCreate?`<button class="btn btn-primary" id="addCustomerBtn">${ICONS.plus}عميل جديد</button>`:""}
  </div>
  <div class="table-wrap"><table><thead><tr>
    <th>تصنيفي</th>${fields.map(f=>`<th>${esc(f.label)}</th>`).join("")}${canDeactivate?"<th></th>":""}
  </tr></thead><tbody>
  ${list.map(cu=>{
    const myTag=myTagOf(cu.id);
    return `<tr><td>
      <select class="tagSelect" data-tagcustomer="${cu.id}" style="font-size:11.5px; padding:3px 6px; border:2px solid ${myTagColor(myTag)}; border-radius:5px;">
        ${["d","a","b","c"].map(k=>`<option value="${k}" ${myTag===k?"selected":""}>${esc(myTagLabel(k))}</option>`).join("")}
      </select>
    </td>${fields.map(f=>CUSTOMER_CELL_RENDERERS[f.key](cu)).join("")}${canDeactivate?`<td><button class="btn btn-outline btn-sm" data-deactivate="${cu.id}">${cu.is_active?"إيقاف":"تنشيط"}</button></td>`:""}</tr>`;
  }).join("")
    || `<tr><td colspan="${fields.length+2}" class="empty-state">لا يوجد عملاء ضمن هذا التصنيف</td></tr>`}
  </tbody></table></div>`;

  $$("[data-tagfilter]").forEach(el=>el.addEventListener("click",()=>{ ST.view.params={...ST.view.params,tag:el.dataset.tagfilter}; renderCustomers($("#content")); }));
  $("#renameTagsBtn").addEventListener("click",openTagLabelsModal);
  $$(".tagSelect").forEach(el=>el.addEventListener("change",async()=>{
    const customerId=el.dataset.tagcustomer, tagKey=el.value;
    const {error}=await sb.from("collector_customer_tags").upsert({user_id:ST.currentUserId, customer_id:customerId, tag_key:tagKey},{onConflict:"user_id,customer_id"});
    if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
    await refreshTables(["collectorTags"]); renderCustomers($("#content"));
  }));
  $("#cSearch").addEventListener("input",e=>{ ST.view.params={...ST.view.params,q:e.target.value}; renderCustomers($("#content")); });
  $("#cCatFilter").addEventListener("change",e=>{ ST.view.params={...ST.view.params,cat:e.target.value}; renderCustomers($("#content")); });
  $$("[data-open]").forEach(el=>el.addEventListener("click",()=>navigate("detail",{id:el.dataset.open})));
  const addBtn=$("#addCustomerBtn"); if(addBtn) addBtn.addEventListener("click",()=>openCustomerModal(null));
  $$("[data-deactivate]").forEach(el=>el.addEventListener("click",async()=>{
    const cu=ST.customers.find(x=>x.id===el.dataset.deactivate);
    const old={is_active:cu.is_active}; const newVal=!cu.is_active;
    const {error}=await sb.from("customers").update({is_active:newVal}).eq("id",cu.id);
    if(error){ showToast("تعذر الحفظ: "+error.message,true); return; }
    logActivity("update","customers",cu.id,old,{is_active:newVal});
    await refreshTables(["customers"]); render();
  }));
}
function openTagLabelsModal(){
  const modal=$("#modalReminder"); // إعادة استخدام نفس نقطة التركيب البسيطة
  modal.innerHTML=`
  <div class="modal-header"><h2>تسمية تصنيفاتي الشخصية</h2><span class="x" data-close="overlayReminder">✕</span></div>
  <div class="modal-body">
    <div style="font-size:12px; color:var(--gray-500); margin-bottom:10px;">هذي تصنيفات خاصة فيك أنت فقط لتنظيم عملائك، منفصلة تماماً عن فئة العميل الرسمية. "${esc(DEFAULT_TAG_LABELS.d)}" يظهر تلقائياً لأي عميل لم تصنّفه.</div>
    ${["a","b","c"].map(k=>`<div class="field"><label>تصنيف "${DEFAULT_TAG_LABELS[k]}"</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="tagLabel_${k}" value="${esc(myTagLabel(k))}" style="flex:1;">
        <input type="color" id="tagColor_${k}" value="${myTagColor(k)}" style="width:44px; height:38px; padding:2px; flex-shrink:0;">
      </div>
    </div>`).join("")}
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline" data-close="overlayReminder">إلغاء</button>
    <button class="btn btn-primary" id="saveTagLabelsBtn">حفظ</button>
  </div>`;
  $("#overlayReminder").classList.add("show");

const ATTACH_ICONS={pdf:"📄",doc:"📝",docx:"📝",xls:"📊",xlsx:"📊",jpg:"🖼️",jpeg:"🖼️",png:"🖼️",webp:"🖼️"};
function attachExt(name){ return (name.split(".").pop()||"").toLowerCase(); }
async function loadAttachments(customerId){
  const box=$("#attachmentsList"); if(!box) return;
  const {data,error}=await sb.from("attachments").select("*").eq("entity_type","customer").eq("entity_id",customerId).order("created_at",{ascending:false});
  if(error){ box.innerHTML=`<div class="empty-state">تعذر تحميل المرفقات</div>`; return; }
  if(!data.length){ box.innerHTML=`<div class="empty-state">لا توجد مرفقات بعد</div>`; return; }
  box.innerHTML=data.map(a=>`
    <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 4px; border-bottom:1px solid var(--gray-100); font-size:12.5px;">
      <span>${ATTACH_ICONS[attachExt(a.file_name)]||"📎"} ${esc(a.file_name)} <span style="color:var(--gray-500); font-size:11px;">— ${esc(userName(a.uploaded_by))} — ${new Date(a.created_at).toLocaleDateString('ar-EG')}</span></span>
      <span style="display:flex; gap:6px;">
        <button class="btn btn-outline btn-sm" data-download-attach="${a.id}" data-path="${esc(a.file_url)}">تحميل</button>
        <button class="btn btn-outline btn-sm" data-delete-attach="${a.id}" data-path="${esc(a.file_url)}">حذف</button>
      </span>
    </div>`).join("");
  $$("[data-download-attach]").forEach(el=>el.addEventListener("click",async()=>{
    const {data:signed,error:sErr}=await sb.storage.from("attachments").createSignedUrl(el.dataset.path,60);
    if(sErr){ showToast("تعذر فتح الملف: "+sErr.message,true); return; }
    window.open(signed.signedUrl,"_blank");
  }));
  $$("[data-delete-attach]").forEach(el=>el.addEventListener("click",async()=>{
    if(!confirm("حذف هذا المرفق نهائياً؟")) return;
    const attachId=el.dataset.deleteAttach, path=el.dataset.path;
    await sb.storage.from("attachments").remove([path]);
    const {error}=await sb.from("attachments").delete().eq("id",attachId);
    if(error){ showToast("تعذر الحذف: "+error.message,true); return; }
    logActivity("delete","attachments",attachId,null,{path});
    showToast("تم حذف المرفق"); loadAttachments(customerId);
  }));
}
async function uploadAttachment(e,customerId){
  const file=e.target.files[0]; if(!file) return;
  if(file.size > 10*1024*1024){ showToast("حجم الملف كبير جداً (الحد 10MB)",true); e.target.value=""; return; }
  const path=`${customerId}/${Date.now()}_${file.name.replace(/[^\w.\-ا-ي\s]/g,"")}`;
  showToast("جاري رفع الملف...");
  const {error:upErr}=await sb.storage.from("attachments").upload(path,file);
  if(upErr){ showToast("تعذر رفع الملف: "+upErr.message,true); e.target.value=""; return; }
  const {error}=await sb.from("attachments").insert({entity_type:"customer",entity_id:customerId,file_name:file.name,file_url:path,uploaded_by:ST.currentUserId});
  if(error){ showToast("تعذر حفظ بيانات المرفق: "+error.message,true); e.target.value=""; return; }
  logActivity("create","attachments",customerId,null,{file_name:file.name});
  showToast("تم رفع المرفق"); e.target.value=""; loadAttachments(customerId);
}
